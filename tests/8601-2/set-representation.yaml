# yaml-language-server: $schema=../../schema/conformance-class.yaml
---
id: conf-class:set-representation
name: Set representation
description: >
  Tests for parsing, generation, and validity of set representations including
  enumeration, single-element sets, and range expansion.
standardization_target_type: iso-8601-date-time-processor
dependencies:
  - 8601-1:conf-class:date-and-time
requirements_class: req-class:set-representation
source: ISO 8601-2:2026 Clause 6
tests:
  # --- Enumeration set (Clause 6.2) ---
  - id: conf-test:set-enumeration-parsing-001
    description: "Parse enumeration set of years '{1960,1961,1962,1963}'"
    requirements:
      - req:set-enumeration
    test_type: parsing
    given:
      expression: "{1960,1961,1962,1963}"
    expect:
      valid: true
      components:
        set:
          type: enumeration
          members:
            - year: 1960
            - year: 1961
            - year: 1962
            - year: 1963

  - id: conf-test:set-enumeration-parsing-002
    description: "Parse enumeration set with mixed precision '{1960,1961-12}'"
    requirements:
      - req:set-enumeration
    test_type: parsing
    given:
      expression: "{1960,1961-12}"
    expect:
      valid: true
      components:
        set:
          type: enumeration
          members:
            - year: 1960
            - year: 1961
              month: 12

  # --- Single element set (Clause 6.3) ---
  - id: conf-test:set-single-element-parsing-001
    description: "Parse single element set '[1984,1986,1988]'"
    requirements:
      - req:set-single-element
    test_type: parsing
    given:
      expression: "[1984,1986,1988]"
    expect:
      valid: true
      components:
        set:
          type: single_element
          members:
            - year: 1984
            - year: 1986
            - year: 1988

  - id: conf-test:set-single-element-parsing-002
    description: "Parse single element set with mixed precision '[1667,1760-12]'"
    requirements:
      - req:set-single-element
    test_type: parsing
    given:
      expression: "[1667,1760-12]"
    expect:
      valid: true
      components:
        set:
          type: single_element
          members:
            - year: 1667
            - year: 1760
              month: 12

  # --- Range: on or before (Clause 6.4.1) ---
  - id: conf-test:set-range-before-parsing-001
    description: "Parse on-or-before range '..1984'"
    requirements:
      - req:set-range-before
    test_type: parsing
    given:
      expression: "..1984"
    expect:
      valid: true
      components:
        range:
          type: on_or_before
          end:
            year: 1984

  - id: conf-test:set-range-before-parsing-002
    description: "Parse on-or-before month range '..1984-10'"
    requirements:
      - req:set-range-before
    test_type: parsing
    given:
      expression: "..1984-10"
    expect:
      valid: true
      components:
        range:
          type: on_or_before
          end:
            year: 1984
            month: 10

  - id: conf-test:set-range-before-parsing-003
    description: "Parse on-or-before day range '..1760-12-03'"
    requirements:
      - req:set-range-before
    test_type: parsing
    given:
      expression: "..1760-12-03"
    expect:
      valid: true
      components:
        range:
          type: on_or_before
          end:
            year: 1760
            month: 12
            day: 3

  # --- Range: on or after (Clause 6.4.2) ---
  - id: conf-test:set-range-after-parsing-001
    description: "Parse on-or-after range '1984..'"
    requirements:
      - req:set-range-after
    test_type: parsing
    given:
      expression: "1984.."
    expect:
      valid: true
      components:
        range:
          type: on_or_after
          start:
            year: 1984

  - id: conf-test:set-range-after-parsing-002
    description: "Parse on-or-after month range '1760-12..'"
    requirements:
      - req:set-range-after
    test_type: parsing
    given:
      expression: "1760-12.."
    expect:
      valid: true
      components:
        range:
          type: on_or_after
          start:
            year: 1760
            month: 12

  - id: conf-test:set-range-after-parsing-003
    description: "Parse on-or-after day range '1984-10-10..'"
    requirements:
      - req:set-range-after
    test_type: parsing
    given:
      expression: "1984-10-10.."
    expect:
      valid: true
      components:
        range:
          type: on_or_after
          start:
            year: 1984
            month: 10
            day: 10

  # --- Range: between (Clause 6.4.3) ---
  - id: conf-test:set-range-between-parsing-001
    description: "Parse between range '1670..1673'"
    requirements:
      - req:set-range-between
    test_type: parsing
    given:
      expression: "1670..1673"
    expect:
      valid: true
      components:
        range:
          type: between
          start:
            year: 1670
          end:
            year: 1673

  - id: conf-test:set-range-between-parsing-002
    description: "Parse between day range '1984-10-10..1984-11-01'"
    requirements:
      - req:set-range-between
    test_type: parsing
    given:
      expression: "1984-10-10..1984-11-01"
    expect:
      valid: true
      components:
        range:
          type: between
          start:
            year: 1984
            month: 10
            day: 10
          end:
            year: 1984
            month: 11
            day: 1

  # --- Combined ranges (Clause 6.4.4) ---
  - id: conf-test:set-range-combined-parsing-001
    description: "Parse combined ranges '..1983-12-31,1984-10-10..1984-11-01,1984-11-05..'"
    requirements:
      - req:set-range-combined
    test_type: parsing
    given:
      expression: "..1983-12-31,1984-10-10..1984-11-01,1984-11-05.."
    expect:
      valid: true
      components:
        set:
          type: enumeration
          members:
            - range:
                type: on_or_before
                end:
                  year: 1983
                  month: 12
                  day: 31
            - range:
                type: between
                start:
                  year: 1984
                  month: 10
                  day: 10
                end:
                  year: 1984
                  month: 11
                  day: 1
            - range:
                type: on_or_after
                start:
                  year: 1984
                  month: 11
                  day: 5

  # --- Set with expansion (Clause 6.5) ---
  - id: conf-test:set-expansion-parsing-001
    description: "Parse set with range expansion '{1667,1668,1670..1672}'"
    requirements:
      - req:set-expansion-in-set
    test_type: parsing
    given:
      expression: "{1667,1668,1670..1672}"
    expect:
      valid: true
      components:
        set:
          type: enumeration
          members:
            - year: 1667
            - year: 1668
            - range:
                type: between
                start:
                  year: 1670
                end:
                  year: 1672

  - id: conf-test:set-expansion-parsing-002
    description: "Parse single element with open range '[1760-01,1760-02,1760-12..]'"
    requirements:
      - req:set-expansion-in-set
    test_type: parsing
    given:
      expression: "[1760-01,1760-02,1760-12..]"
    expect:
      valid: true
      components:
        set:
          type: single_element
          members:
            - year: 1760
              month: 1
            - year: 1760
              month: 2
            - range:
                type: on_or_after
                start:
                  year: 1760
                  month: 12

  # --- Integer expressions (Clause 6.7) ---
  - id: conf-test:set-integer-parsing-001
    description: "Parse integer enumeration with range '{1,2..5}'"
    requirements:
      - req:set-integer-expressions
    test_type: parsing
    given:
      expression: "{1,2..5}"
    expect:
      valid: true
      components:
        set:
          type: enumeration
          members:
            - value: 1
            - range:
                type: between
                start:
                  value: 2
                end:
                  value: 5

  - id: conf-test:set-integer-parsing-002
    description: "Parse single element integer set '[1,3,5]'"
    requirements:
      - req:set-integer-expressions
    test_type: parsing
    given:
      expression: "[1,3,5]"
    expect:
      valid: true
      components:
        set:
          type: single_element
          members:
            - value: 1
            - value: 3
            - value: 5

  # --- Integer sets within grouped units ---
  - id: conf-test:set-integer-grouped-parsing-001
    description: "Parse date with integer set in grouped unit '2018-{1,3,5}G2MU'"
    requirements:
      - req:set-integer-expressions
    test_type: parsing
    given:
      expression: "2018-{1,3,5}G2MU"
    expect:
      valid: true
      components:
        year: 2018
        set:
          type: enumeration
          members:
            - value: 1
            - value: 3
            - value: 5
        grouping:
          duration_units:
            month: 2

  - id: conf-test:set-integer-grouped-parsing-002
    description: "Parse date with single element integer set '2018-[2,4]G3MU'"
    requirements:
      - req:set-integer-expressions
    test_type: parsing
    given:
      expression: "2018-[2,4]G3MU"
    expect:
      valid: true
      components:
        year: 2018
        set:
          type: single_element
          members:
            - value: 2
            - value: 4
        grouping:
          duration_units:
            month: 3
