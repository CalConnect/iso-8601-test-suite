# yaml-language-server: $schema=../../schema/conformance-class.yaml
---
id: conf-class:qualification
name: Qualification of uncertainty and approximation
description: >
  Tests for parsing, generation, and validity of qualified date and time expressions
  with uncertain (?), approximate (~), or both (%) markers.
standardization_target_type: iso-8601-date-time-processor
dependencies:
  - 8601-1:conf-class:date-and-time
requirements_class: req-class:qualification
source: ISO 8601-2:2026 Clause 8
tests:
  # --- Individual qualification: Calendar year ---
  - id: conf-test:qualification-year-implicit-parsing-001
    description: "Parse uncertain calendar year implicit '?1985'"
    requirements:
      - req:qualification-year-implicit
    test_type: parsing
    given:
      expression: "?1985"
    expect:
      valid: true
      components:
        year: 1985
        qualification:
          year:
            uncertain: true

  - id: conf-test:qualification-year-explicit-parsing-001
    description: "Parse uncertain calendar year explicit '2018?Y'"
    requirements:
      - req:qualification-year-explicit
    test_type: parsing
    given:
      expression: "2018?Y"
    expect:
      valid: true
      components:
        year: 2018
        qualification:
          year:
            uncertain: true

  # --- Individual qualification: Calendar month ---
