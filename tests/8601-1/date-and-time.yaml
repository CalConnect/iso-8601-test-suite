# yaml-language-server: $schema=../../schema/conformance-class.yaml
---
id: conf-class:date-and-time
name: Date and time of day conformance tests
description: >
  Tests for date and time of day combinations including calendar date + time,
  ordinal date + time, and week date + time, in basic and extended formats,
  with UTC and offset variants.
standardization_target_type: iso-8601-date-time-processor
dependencies:
  - conf-class:calendar-date
  - conf-class:time-of-day
requirements_class: req-class:date-and-time
source: ISO 8601-1:2026 Clause 5.4
tests:
  # Parsing tests: calendar date + time, basic format
  - id: conf-test:date-time-parse-001
    description: "Parse basic format calendar date and time 19850412T232030"
    requirements:
      - req:date-time-cal-basic-local
    test_type: parsing
    given:
      expression: "19850412T232030"
    expect:
      valid: true
      components:
        calendar:
          year: 1985
          month: 4
          day: 12
        time:
          hour: 23
          minute: 20
          second: 30

  - id: conf-test:date-time-parse-002
    description: "Parse basic format calendar date and UTC time 19850412T232030Z"
    requirements:
      - req:date-time-cal-basic-utc
    test_type: parsing
    given:
      expression: "19850412T232030Z"
    expect:
      valid: true
      components:
        calendar:
          year: 1985
          month: 4
          day: 12
        time:
          hour: 23
          minute: 20
          second: 30
          utc_offset:
            sign: "+"
            hours: 0
            minutes: 0

  - id: conf-test:date-time-parse-003
    description: "Parse basic format calendar date and time with offset 19850412T232030+0400"
    requirements:
      - req:date-time-cal-basic-offset
    test_type: parsing
    given:
      expression: "19850412T232030+0400"
    expect:
      valid: true
      components:
        calendar:
          year: 1985
          month: 4
          day: 12
        time:
          hour: 23
          minute: 20
          second: 30
          utc_offset:
            sign: "+"
            hours: 4
            minutes: 0

  - id: conf-test:date-time-parse-004
    description: "Parse basic format calendar date and time with hours-only offset 19850412T232030+04"
    requirements:
      - req:date-time-cal-basic-offset
    test_type: parsing
    given:
      expression: "19850412T232030+04"
    expect:
      valid: true
      components:
        calendar:
          year: 1985
          month: 4
          day: 12
        time:
          hour: 23
          minute: 20
          second: 30
          utc_offset:
            sign: "+"
            hours: 4

  # Parsing tests: calendar date + time, extended format
  - id: conf-test:date-time-parse-005
    description: "Parse extended format calendar date and time 1985-04-12T23:20:30"
