    expect:
      valid: false

  # Equivalence tests
  - id: conf-test:date-time-equiv-001
    description: "Basic and extended format represent the same date and time"
    requirements:
      - req:date-time-cal-basic-local
      - req:date-time-cal-extended-local
    test_type: equivalence
    given:
      expression_a: "19850412T232030"
      expression_b: "1985-04-12T23:20:30"
    expect:
      equivalent: true
