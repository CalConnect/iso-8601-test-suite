name: Validate

on:
  push:
    paths:
      - '**.yaml'
      - '**.yml'
      - 'scripts/validate'
  pull_request:
    paths:
      - '**.yaml'
      - '**.yml'
      - 'scripts/validate'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Run validation
        run: ruby scripts/validate
