# yaml-language-server: $schema=../schema/conformance-result.yaml
#
# Conformance test results for Ruby's standard library Date/DateTime/Time classes
# against the ISO 8601-1:2026 and ISO 8601-2:2026 test suite.
#
# Ruby's Date.parse is a permissive parser that accepts many non-ISO-8601 formats.
# For stricter ISO 8601 compliance, Date.iso8601 / DateTime.iso8601 should be used.
# Ruby has no native support for ISO 8601 durations, time intervals, or recurring
# intervals. Part 2 features (qualification, unspecified digits, etc.) are not
# supported.
#
# verification: inferred — results based on known Ruby 3.3 behavior, not automated execution.
# A human should verify these results by running the documented code snippets.
---
id: result:ruby-date-datetime-time
implementation:
  name: "Ruby Date/DateTime/Time"
  description: >-
    Ruby standard library date and time classes. Date handles calendar dates,
    DateTime adds time-of-day, and Time handles time with timezone support.
    None of these are strict ISO 8601 validators — they are general-purpose
    date/time parsers that happen to support many ISO 8601 formats.
  language: ruby
  version: "3.3.0"
  url: "https://ruby-doc.org/stdlib-3.3.0/"
  modules:
    - name: Date
      class: Date
      methods: [parse, iso8601, new, valid_date?, today, commercial, ordinal]
    - name: DateTime
      class: DateTime
      methods: [parse, iso8601, new, now]
    - name: Time
      class: Time
      methods: [parse, new, now, iso8601, strptime]

date: "2026-04-27"
tester: "ISO 8601 Test Suite — inferred results"
verification: inferred
notes: >-
  Results are inferred from known Ruby 3.3 stdlib behavior.
  Date.parse is deliberately permissive — it accepts many formats beyond ISO 8601.
  This is a feature, not a bug, but it means Ruby fails strict ISO 8601 validity tests
  that require rejecting non-standard formats (e.g., spaces as separators).
  For strict ISO 8601 parsing, use Date.iso8601 instead of Date.parse.

profiles_tested:
  - profile:iso-8601-1-complete

conformance_class_results:
  # ================================================================
  # CONFORMANCE CLASS: fundamentals (58 tests)
  # Status: PARTIAL — Ruby handles calendar validation well but is not
  # a strict ISO 8601 character-set validator. Permissive parser accepts
  # non-ISO formats (e.g., spaces, missing leading zeros).
  # ================================================================
  - conformance_class: conf-class:fundamentals
    status: partial
    notes: >-
      Ruby Date handles leap year, days-per-month, and basic calendar validation
      correctly via Date.new and Date.valid_date?. However, Date.parse is permissive
      and accepts non-ISO-8601 formats (spaces, missing leading zeros). Duration,
      recurring interval, and time-of-day expressions are not handled by the Date class.
    default_method:
      language: ruby
      code: 'Date.parse("{expression}")'
      api: Date.parse
    test_results:
      # --- Character set validity (001–007) ---
      - test: conf-test:fundamentals-valid-001
        result: pass
        method:
          code: 'Date.parse("1985-04-12").to_s'
          api: Date.parse
        actual:
          returned: '"1985-04-12"'

      - test: conf-test:fundamentals-valid-002
        result: pass
        method:
          code: 'Date.parse("20230101").to_s'
          api: Date.parse
        actual:
          returned: '"2023-01-01"'

      - test: conf-test:fundamentals-valid-003
        result: not-supported
        notes: "Duration expression — Date.parse does not handle durations"
        method:
          code: 'Date.parse("P1Y2M10DT2H30M")'
          api: Date.parse
        actual:
          exception: "Date::Error: invalid date"

      - test: conf-test:fundamentals-valid-004
        result: not-supported
        notes: "Time-of-day expression — Date.parse does not parse time-only strings"
        method:
          code: 'Date.parse("T232030Z")'
          api: Date.parse
        actual:
          exception: "Date::Error: invalid date"

      - test: conf-test:fundamentals-valid-005
        result: not-supported
        notes: "Recurring interval — not handled by Date.parse"
        method:
          code: 'Date.parse("R5/19850412/19850425")'
          api: Date.parse
        actual:
          exception: "Date::Error: invalid date"

      - test: conf-test:fundamentals-valid-006
        result: fail
        notes: >-
          CRITICAL: Ruby's Date.parse accepts spaces as separators, which violates
          ISO 8601 character set rules. A strict ISO 8601 processor must reject this.
        method:
          code: 'begin; Date.parse("1985 04 12"); true; rescue Date::Error; false; end'
          api: Date.parse
        actual:
          valid: true
          returned: '"1985-04-12"'
          notes: "Ruby accepts spaces — ISO 8601 requires rejection"

      - test: conf-test:fundamentals-valid-007
        result: pass
        method:
          code: 'begin; Date.parse("AB85-04-12"); true; rescue Date::Error; false; end'
          api: Date.parse
        actual:
          valid: false
          exception: "Date::Error: invalid date"

      # --- Leap year tests (008–012) ---
      - test: conf-test:fundamentals-valid-008
        result: pass
        method:
          code: 'Date.new(2000, 2, 29).to_s'
          api: Date.new
        actual:
          valid: true
          returned: '"2000-02-29"'

      - test: conf-test:fundamentals-valid-009
        result: pass
        method:
          code: 'Date.parse("2000-02-29").to_s'
          api: Date.parse
        actual:
          valid: true
          returned: '"2000-02-29"'

      - test: conf-test:fundamentals-valid-010
        result: pass
        method:
          code: 'Date.valid_date?(1900, 2, 29)'
          api: Date.valid_date?
        actual:
          valid: false
          returned: "false"

      - test: conf-test:fundamentals-valid-011
        result: pass
        method:
          code: 'Date.valid_date?(2023, 2, 29)'
          api: Date.valid_date?
        actual:
          valid: false
          returned: "false"

      - test: conf-test:fundamentals-valid-012
        result: pass
        method:
          code: 'Date.valid_date?(2024, 2, 29)'
          api: Date.valid_date?
        actual:
          valid: true
          returned: "true"

      # --- Days per month tests (013–021) ---
      - test: conf-test:fundamentals-valid-013
        result: pass
        method:
          code: 'Date.valid_date?(2023, 1, 31)'
          api: Date.valid_date?
        actual:
          valid: true

      - test: conf-test:fundamentals-valid-014
        result: pass
        method:
          code: 'Date.valid_date?(2023, 1, 32)'
          api: Date.valid_date?
        actual:
          valid: false

      - test: conf-test:fundamentals-valid-015
        result: pass
        method:
          code: 'Date.valid_date?(2023, 4, 30)'
          api: Date.valid_date?
        actual:
          valid: true

      - test: conf-test:fundamentals-valid-016
        result: pass
        method:
          code: 'Date.valid_date?(2023, 4, 31)'
          api: Date.valid_date?
        actual:
          valid: false

      - test: conf-test:fundamentals-valid-017
        result: pass
        method:
          code: 'Date.valid_date?(2023, 2, 28)'
          api: Date.valid_date?
        actual:
          valid: true

      - test: conf-test:fundamentals-valid-018
        result: pass
        method:
          code: 'Date.valid_date?(2023, 2, 29)'
          api: Date.valid_date?
        actual:
          valid: false

      - test: conf-test:fundamentals-valid-019
        result: pass
        method:
          code: 'Date.valid_date?(2023, 13, 1)'
          api: Date.valid_date?
        actual:
          valid: false

      - test: conf-test:fundamentals-valid-020
        result: pass
        method:
          code: 'Date.valid_date?(2023, 0, 1)'
          api: Date.valid_date?
        actual:
          valid: false

      - test: conf-test:fundamentals-valid-021
        result: pass
        method:
          code: 'Date.valid_date?(2023, 1, 0)'
          api: Date.valid_date?
        actual:
          valid: false

      # --- Year representation parsing (parse 001–003) ---
      - test: conf-test:fundamentals-parse-001
        result: pass
        notes: "Date.parse interprets '1985' as year, defaults to Jan 1"
        method:
          code: 'Date.parse("1985").year'
          api: Date.parse
        actual:
          returned: "1985"

      - test: conf-test:fundamentals-parse-002
        result: pass
        method:
          code: 'Date.parse("0000").year'
          api: Date.parse
        actual:
          returned: "0"

      - test: conf-test:fundamentals-parse-003
        result: pass
        method:
          code: 'Date.parse("9999").year'
          api: Date.parse
        actual:
          returned: "9999"

      # --- Century/decade representation (parse 004–006) ---
      - test: conf-test:fundamentals-parse-004
        result: not-supported
        notes: "Ruby has no century representation — '19' interpreted as year 0019"
        method:
          code: 'Date.parse("19")'
          api: Date.parse
        actual:
          exception: "Date::Error or interpreted as year 0019"

      - test: conf-test:fundamentals-parse-005
        result: not-supported
        notes: "Ruby has no century representation"
        method:
          code: 'Date.parse("00")'
          api: Date.parse
        actual:
          exception: "Date::Error or interpreted as year 0000"

      - test: conf-test:fundamentals-parse-006
        result: not-supported
        notes: "Ruby has no decade representation"
        method:
          code: 'Date.parse("196")'
          api: Date.parse
        actual:
          exception: "Date::Error or ambiguous"

      # --- Generation tests (gen 001–003) ---
      - test: conf-test:fundamentals-gen-001
        result: not-supported
        notes: "Ruby generates full dates, not year-only representations"
        method:
          code: 'Date.new(1985, 1, 1).year.to_s'
          api: Date#year
        actual:
          returned: '"1985"'
          notes: "Only the year number, not an ISO 8601 year representation"

      - test: conf-test:fundamentals-gen-002
        result: not-supported
        notes: "Ruby has no century generation"
        actual:
          notes: "No API to generate '19' as a century"

      - test: conf-test:fundamentals-gen-003
        result: not-supported
        notes: "Ruby has no decade generation"
        actual:
          notes: "No API to generate '196' as a decade"

      # --- Time shift validity (valid 022–025) ---
      - test: conf-test:fundamentals-valid-022
        result: pass
        method:
          code: 'Time.parse("2023-01-01T00:00:00Z").utc_offset'
          api: Time.parse
        actual:
          valid: true
          returned: "0"

      - test: conf-test:fundamentals-valid-023
        result: pass
        method:
          code: 'Time.parse("2023-01-01T00:00:00+01:00").utc_offset'
          api: Time.parse
        actual:
          valid: true
          returned: "3600"

      - test: conf-test:fundamentals-valid-024
        result: pass
        method:
          code: 'Time.parse("2023-01-01T00:00:00-05:00").utc_offset'
          api: Time.parse
        actual:
          valid: true
          returned: "-18000"

      - test: conf-test:fundamentals-valid-025
        result: pass
        method:
          code: 'Time.parse("2023-01-01T00:00:00+0500").utc_offset'
          api: Time.parse
        actual:
          valid: true
          returned: "18000"

      # --- 24-hour clock validity (valid 026–028) ---
      - test: conf-test:fundamentals-valid-026
        result: pass
        method:
          code: 'Time.new(2023, 1, 1, 0, 0, 0).hour'
          api: Time.new
        actual:
          valid: true
          returned: "0"

      - test: conf-test:fundamentals-valid-027
        result: pass
        method:
          code: 'Time.new(2023, 1, 1, 23, 0, 0).hour'
          api: Time.new
        actual:
          valid: true
          returned: "23"

      - test: conf-test:fundamentals-valid-028
        result: pass
        method:
          code: 'Time.new(2023, 1, 1, 24, 30, 61).hour rescue "error"'
          api: Time.new
        actual:
          valid: false
          notes: "Ruby rejects hour 24 in Time.new"

      # --- Leading zeros, decreasing order, Gregorian, week calendar (valid 029–045) ---
      - test: conf-test:fundamentals-valid-029
        result: fail
        notes: "Date.parse accepts '1985-4-12' without leading zero on month"
        method:
          code: 'begin; Date.parse("1985-4-12"); true; rescue; false; end'
          api: Date.parse
        actual:
          valid: true
          notes: "Ruby does not enforce leading zeros — accepts '1985-4-12'"

      - test: conf-test:fundamentals-valid-030
        result: pass
        method:
          code: 'Date.parse("1985-04-12").to_s'
          api: Date.parse
        actual:
          valid: true

      - test: conf-test:fundamentals-valid-031
        result: pass
        method:
          code: 'Time.parse("23:20:50").to_s'
          api: Time.parse
        actual:
          valid: true

      - test: conf-test:fundamentals-valid-032
        result: pass
        method:
          code: 'Date.parse("20231215").to_s'
          api: Date.parse
        actual:
          valid: true

      - test: conf-test:fundamentals-valid-033
        result: pass
        method:
          code: 'Date.parse("20231231").to_s'
          api: Date.parse
        actual:
          valid: true

      - test: conf-test:fundamentals-valid-034
        result: pass
        method:
          code: 'Date.commercial(2023, 1, 1).cwday'
          api: Date.commercial
        actual:
          valid: true
          returned: "1"

      - test: conf-test:fundamentals-valid-035
        result: pass
        method:
          code: 'Date.commercial(2023, 1, 7).cwday'
          api: Date.commercial
        actual:
          valid: true
          returned: "7"

      - test: conf-test:fundamentals-valid-036
        result: pass
        method:
          code: 'Date.commercial(2023, 1, 8) rescue "error"'
          api: Date.commercial
        actual:
          valid: false
          notes: "Ruby raises ArgumentError for day-of-week 8"

      # Month representation (parse 007–008)
      - test: conf-test:fundamentals-parse-007
        result: pass
        method:
          code: 'Date.parse("1985-01").to_s'
          api: Date.parse
        actual:
          returned: '"1985-01-01"'

      - test: conf-test:fundamentals-parse-008
        result: pass
        method:
          code: 'Date.parse("1985-12").to_s'
          api: Date.parse
        actual:
          returned: '"1985-12-01"'

      # Week number representation (valid 037–039)
      - test: conf-test:fundamentals-valid-037
        result: pass
        method:
          code: 'Date.commercial(2023, 1, 1).cweek'
          api: Date.commercial
        actual:
          valid: true

      - test: conf-test:fundamentals-valid-038
        result: pass
        method:
          code: 'Date.commercial(2020, 53, 1).cweek'
          api: Date.commercial
        actual:
          valid: true

      - test: conf-test:fundamentals-valid-039
        result: pass
        notes: "Ruby raises ArgumentError for W54"
        method:
          code: 'Date.commercial(2023, 54, 1) rescue "error"'
          api: Date.commercial
        actual:
          valid: false

      # Day of week representation (valid 040–041)
      - test: conf-test:fundamentals-valid-040
        result: pass
      - test: conf-test:fundamentals-valid-041
        result: pass

      # Day of year representation (valid 042–045)
      - test: conf-test:fundamentals-valid-042
        result: pass
        method:
          code: 'Date.ordinal(2023, 1).yday'
          api: Date.ordinal
        actual:
          valid: true
          returned: "1"

      - test: conf-test:fundamentals-valid-043
        result: pass
        method:
          code: 'Date.ordinal(2023, 365).yday'
          api: Date.ordinal
        actual:
          valid: true

      - test: conf-test:fundamentals-valid-044
        result: pass
        method:
          code: 'Date.ordinal(2024, 366).yday'
          api: Date.ordinal
        actual:
          valid: true

      - test: conf-test:fundamentals-valid-045
        result: pass
        method:
          code: 'Date.ordinal(2023, 366) rescue "error"'
          api: Date.ordinal
        actual:
          valid: false
          notes: "Ruby raises ArgumentError — 2023 is not a leap year"

      # Expansion tests (parse 009–010)
      - test: conf-test:fundamentals-parse-009
        result: fail
        notes: "Ruby Date does not support expanded year format +001985"
        method:
          code: 'Date.iso8601("+001985")'
          api: Date.iso8601
        actual:
          exception: "Date::Error: invalid date"

      - test: conf-test:fundamentals-parse-010
        result: fail
        notes: "Ruby Date does not support negative years"
        method:
          code: 'Date.iso8601("-000001")'
          api: Date.iso8601
        actual:
          exception: "Date::Error: invalid date"

  # ================================================================
  # CONFORMANCE CLASS: calendar-date (32 tests)
  # Status: PARTIAL — Ruby handles basic and extended calendar dates,
  # but Date.parse is permissive (accepts non-ISO formats). Expanded
  # year and century/decade representations not supported.
  # ================================================================
  - conformance_class: conf-class:calendar-date
    status: partial
    notes: >-
      Ruby Date.parse and Date.iso8601 handle basic (YYYYMMDD) and extended
      (YYYY-MM-DD) calendar dates. Reduced precision YYYY-MM works. Expanded
      years (+001985), negative years, and century/decade representations
      are not supported. Date.valid_date? correctly validates dates.
    default_method:
      language: ruby
      code: 'Date.iso8601("{expression}")'
      api: Date.iso8601
    test_results:
      # --- Parsing ---
      - test: conf-test:cal-date-parse-001        # "19850412"
        result: pass
        actual:
          returned: '"1985-04-12"'
      - test: conf-test:cal-date-parse-002        # "1985-04-12"
        result: pass
        actual:
          returned: '"1985-04-12"'
      - test: conf-test:cal-date-parse-003        # "1985-04"
        result: pass
        method:
          code: 'Date.parse("1985-04").to_s'
          api: Date.parse
        actual:
          returned: '"1985-04-01"'
          notes: "Parses year-month, defaults day to 1"
      - test: conf-test:cal-date-parse-004        # "1985"
        result: error
        notes: "Date.parse('1985') returns 1985-01-01, not a year-only representation"
        method:
          code: 'Date.parse("1985").to_s'
          api: Date.parse
        actual:
          returned: '"1985-01-01"'
          notes: "Ruby adds default month/day — not a true reduced precision year"
      - test: conf-test:cal-date-parse-005        # "198" (decade)
        result: not-supported
        notes: "Ruby has no decade representation"
      - test: conf-test:cal-date-parse-006        # "19" (century)
        result: not-supported
        notes: "Ruby has no century representation"
      - test: conf-test:cal-date-parse-007        # "+0019850412"
        result: fail
        notes: "Expanded year format not supported by Date.iso8601"
      - test: conf-test:cal-date-parse-008        # "+001985-04-12"
        result: fail
        notes: "Expanded year format not supported"
      - test: conf-test:cal-date-parse-009        # "+001985-04"
        result: fail
        notes: "Expanded year format not supported"
      - test: conf-test:cal-date-parse-010        # "+001985"
        result: fail
        notes: "Expanded year format not supported"
      - test: conf-test:cal-date-parse-011        # "+00198" (expanded decade)
        result: not-supported
      - test: conf-test:cal-date-parse-012        # "+0019" (expanded century)
        result: not-supported

      # --- Generation ---
      - test: conf-test:cal-date-gen-001          # basic "19850412"
        result: pass
        method:
          code: 'Date.new(1985, 4, 12).strftime("%Y%m%d")'
          api: Date#strftime
        actual:
          returned: '"19850412"'
      - test: conf-test:cal-date-gen-002          # extended "1985-04-12"
        result: pass
        method:
          code: 'Date.new(1985, 4, 12).to_s'
          api: Date#to_s
        actual:
          returned: '"1985-04-12"'
      - test: conf-test:cal-date-gen-003          # "1985-04"
        result: pass
        method:
          code: 'Date.new(1985, 4, 1).strftime("%Y-%m")'
          api: Date#strftime
        actual:
          returned: '"1985-04"'
      - test: conf-test:cal-date-gen-004          # "1985"
        result: pass
        method:
          code: 'Date.new(1985, 1, 1).strftime("%Y")'
          api: Date#strftime
        actual:
          returned: '"1985"'
          notes: "Generates year string, but not a true reduced precision representation"
      - test: conf-test:cal-date-gen-005          # "198" (decade)
        result: not-supported
      - test: conf-test:cal-date-gen-006          # "19" (century)
        result: not-supported
      - test: conf-test:cal-date-gen-007          # "+0019850412"
        result: not-supported
        notes: "Expanded year generation not supported"
      - test: conf-test:cal-date-gen-008          # "+001985-04-12"
        result: not-supported
        notes: "Expanded year generation not supported"

      # --- Validity ---
      - test: conf-test:cal-date-valid-001        # "19851312" month 13
        result: pass
        method:
          code: 'Date.valid_date?(1985, 13, 12)'
          api: Date.valid_date?
        actual:
          valid: false
      - test: conf-test:cal-date-valid-002        # "19850012" month 0
        result: pass
        method:
          code: 'Date.valid_date?(1985, 0, 12)'
          api: Date.valid_date?
        actual:
          valid: false
      - test: conf-test:cal-date-valid-003        # "19850132" day 32
        result: pass
        method:
          code: 'Date.valid_date?(1985, 1, 32)'
          api: Date.valid_date?
        actual:
          valid: false
      - test: conf-test:cal-date-valid-004        # "19850100" day 0
        result: pass
        method:
          code: 'Date.valid_date?(1985, 1, 0)'
          api: Date.valid_date?
        actual:
          valid: false
      - test: conf-test:cal-date-valid-005        # "19850230" Feb 30
        result: pass
        method:
          code: 'Date.valid_date?(1985, 2, 30)'
          api: Date.valid_date?
        actual:
          valid: false
      - test: conf-test:cal-date-valid-006        # "19850431" Apr 31
        result: pass
        method:
          code: 'Date.valid_date?(1985, 4, 31)'
          api: Date.valid_date?
        actual:
          valid: false
      - test: conf-test:cal-date-valid-007        # "198504-12" mixed format
        result: pass
        notes: "Mixed basic/extended format is rejected"
        method:
          code: 'begin; Date.parse("198504-12"); true; rescue; false; end'
          api: Date.parse
        actual:
          valid: false
      - test: conf-test:cal-date-valid-008        # "19850631" Jun 31
        result: pass
        method:
          code: 'Date.valid_date?(1985, 6, 31)'
          api: Date.valid_date?
        actual:
          valid: false
      - test: conf-test:cal-date-valid-009        # "19850931" Sep 31
        result: pass
        method:
          code: 'Date.valid_date?(1985, 9, 31)'
          api: Date.valid_date?
        actual:
          valid: false
      - test: conf-test:cal-date-valid-010        # "19851131" Nov 31
        result: pass
        method:
          code: 'Date.valid_date?(1985, 11, 31)'
          api: Date.valid_date?
        actual:
          valid: false

      # --- Equivalence ---
      - test: conf-test:cal-date-equiv-001
        result: pass
      - test: conf-test:cal-date-equiv-002
        result: pass

  # ================================================================
  # CONFORMANCE CLASS: ordinal-date (15 tests)
  # Status: PARTIAL — Date.ordinal creates dates from ordinal dates,
  # but parsing ordinal date strings (YYYYDDD, YYYY-DDD) is limited.
  # ================================================================
  - conformance_class: conf-class:ordinal-date
    status: partial
    notes: >-
      Date.ordinal(year, yday) creates dates from ordinal dates.
      Date#yday extracts the ordinal day. Parsing strings like "1985102"
      is misinterpreted as YYYYMMDD by Date.parse. Expanded year ordinal
      dates are not supported.
    default_method:
      language: ruby
      code: 'Date.ordinal(year, yday)'
      api: Date.ordinal
    test_results:
      # --- Parsing ---
      - test: conf-test:ord-date-parse-001        # "1985102"
        result: fail
        notes: "Date.parse('1985102') interprets as 1985-10-02, not ordinal day 102"
        method:
          code: 'Date.parse("1985102").to_s'
          api: Date.parse
        actual:
          returned: '"1985-10-02"'
          notes: "Ruby interprets '1985102' as YYYYMMDD with missing digit"
      - test: conf-test:ord-date-parse-002        # "1985-102"
