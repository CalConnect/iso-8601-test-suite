      - test: conf-test:date-time-parse-019       # "1985W155T232030+0400"
        result: fail
      - test: conf-test:date-time-parse-020       # "1985W155T232030+04"
        result: fail
      - test: conf-test:date-time-parse-021       # "1985-W15-5T23:20:30" extended
        result: fail
        notes: "Week date + time not parseable even in extended format"
      - test: conf-test:date-time-parse-022       # "1985-W15-5T23:20:30Z"
