      - test: conf-test:date-time-valid-002       # "1985-04-12T232030" mixed
        result: pass
        notes: "Mixed extended date / basic time is validated"

      # --- Equivalence ---
      - test: conf-test:date-time-equiv-001
        result: pass

  # ================================================================
  # CONFORMANCE CLASS: duration (25 tests)
  # Status: NOT-SUPPORTED — Ruby stdlib has no ISO 8601 duration parser
  # or generator. ActiveSupport::Duration exists but is Rails, not stdlib.
  # ================================================================
  - conformance_class: conf-class:duration
    status: not-supported
    notes: >-
      Ruby standard library has no ISO 8601 duration (PnYnMnDTnHnMnS) parser
      or generator. ActiveSupport (Rails) provides Duration.parse but that is
      not part of Ruby stdlib. All duration tests are not-supported.
    sample_method:
      language: ruby
      code: 'Date.parse("P1Y2M10DT2H30M")'
      api: Date.parse
      result: "Date::Error: invalid date"
    test_results:
      - { test: conf-test:dur-parse-001, result: not-supported }
      - { test: conf-test:dur-parse-002, result: not-supported }
