      - test: conf-test:date-time-parse-006       # "1985-04-12T23:20:30Z"
        result: pass
        actual:
          returned: '"1985-04-12T23:20:30+00:00"'
      - test: conf-test:date-time-parse-007       # "1985-04-12T23:20:30+04:00"
        result: pass
        actual:
