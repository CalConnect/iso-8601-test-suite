  # ================================================================
  # CONFORMANCE CLASS: week-date (21 tests)
  # Status: PARTIAL — Date.commercial creates dates from week dates.
  # Date.parse handles extended week-date format but not basic.
  # Expanded year week-dates not supported.
  # ================================================================
  - conformance_class: conf-class:week-date
    status: partial
    notes: >-
      Date.commercial(year, week, day) creates dates from week dates.
      Date#cweek and Date#cwday extract week components.
      Date.parse handles "YYYY-Www-D" extended format but not "YYYYWwwD" basic.
      Expanded year week-dates are not supported.
    default_method:
      language: ruby
      code: 'Date.commercial(year, week, day)'
      api: Date.commercial
    test_results:
      # --- Parsing ---
      - test: conf-test:week-date-parse-001       # "1985W155" basic
        result: fail
        notes: "Date.parse does not parse basic week-date format YYYYWwwD"
        method:
          code: 'Date.parse("1985W155")'
          api: Date.parse
        actual:
          exception: "Date::Error: invalid date or misinterpreted"
      - test: conf-test:week-date-parse-002       # "1985-W15-5" extended
        result: pass
        method:
          code: 'Date.parse("1985-W15-5").to_s'
          api: Date.parse
        actual:
          returned: '"1985-04-12"'
      - test: conf-test:week-date-parse-003       # "1985W15" basic reduced
        result: fail
        notes: "Basic week-date without day not parseable"
        method:
          code: 'Date.parse("1985W15")'
          api: Date.parse
        actual:
          exception: "Date::Error: invalid date"
      - test: conf-test:week-date-parse-004       # "1985-W15" extended reduced
        result: not-supported
        notes: "Date.parse may not handle week-date without day correctly"
        method:
          code: 'Date.parse("1985-W15")'
          api: Date.parse
        actual:
          notes: "May interpret as date or raise error"
      - test: conf-test:week-date-parse-005       # "+001985W155"
        result: not-supported
        notes: "Expanded year week-date not supported"
      - test: conf-test:week-date-parse-006       # "+001985-W15-5"
        result: not-supported
        notes: "Expanded year week-date not supported"
      - test: conf-test:week-date-parse-007       # "+001985W15"
        result: not-supported
      - test: conf-test:week-date-parse-008       # "+001985-W15"
        result: not-supported

      # --- Generation ---
      - test: conf-test:week-date-gen-001         # basic "1985W155"
        result: pass
        method:
          code: 'Date.commercial(1985, 15, 5).strftime("%GW%V%u")'
          api: Date.commercial
        actual:
          returned: '"1985W155"'
      - test: conf-test:week-date-gen-002         # extended "1985-W15-5"
        result: pass
        method:
          code: 'Date.commercial(1985, 15, 5).strftime("%G-W%V-%u")'
          api: Date.commercial
        actual:
          returned: '"1985-W15-5"'
      - test: conf-test:week-date-gen-003         # basic "1985W15"
        result: pass
        method:
          code: 'Date.commercial(1985, 15, 1).strftime("%GW%V")'
          api: Date.commercial
        actual:
          returned: '"1985W15"'
      - test: conf-test:week-date-gen-004         # extended "1985-W15"
        result: pass
        method:
          code: 'Date.commercial(1985, 15, 1).strftime("%G-W%V")'
          api: Date.commercial
        actual:
          returned: '"1985-W15"'

      # --- Validity ---
      - test: conf-test:week-date-valid-001       # "1985W015" week 01 day 5
        result: pass
        method:
          code: 'Date.commercial(1985, 1, 5).cwday'
          api: Date.commercial
        actual:
          valid: true
      - test: conf-test:week-date-valid-002       # "1985W150" day 0
        result: pass
        method:
          code: 'Date.commercial(1985, 15, 0) rescue "error"'
          api: Date.commercial
        actual:
          valid: false
      - test: conf-test:week-date-valid-003       # "1985W158" day 8
        result: pass
        method:
          code: 'Date.commercial(1985, 15, 8) rescue "error"'
          api: Date.commercial
        actual:
          valid: false
      - test: conf-test:week-date-valid-004       # "1985W545" week 54
        result: pass
        method:
          code: 'Date.commercial(1985, 54, 5) rescue "error"'
          api: Date.commercial
        actual:
          valid: false

      # --- Equivalence ---
      - test: conf-test:week-date-equiv-001
        result: pass

  # ================================================================
  # CONFORMANCE CLASS: time-of-day (54 tests)
  # Status: PARTIAL — Time.parse handles extended time format (hh:mm:ss)
  # with UTC offsets and fractional seconds. Basic format (hhmmss) not
  # supported. Time-of-day only (without date) defaults to today's date.
  # ================================================================
  - conformance_class: conf-class:time-of-day
    status: partial
    notes: >-
      Time.parse handles extended time formats (hh:mm:ss) with UTC offsets
      and fractional seconds. Basic format (hhmmss) not supported by
      Time.parse. Time-of-day without a date defaults to today's date.
      Leap second (second=60) is not supported. Hour 24 (end-of-day)
      is not supported by Time.new.
    default_method:
      language: ruby
      code: 'Time.parse("{expression}")'
      api: Time.parse
    test_results:
      # --- Parsing: basic format (fails) ---
      - test: conf-test:time-parse-001            # "T232050" basic full
        result: fail
        notes: "Time.parse does not parse basic format hhmmss with T prefix"
      - test: conf-test:time-parse-003            # "T2320" basic hm
        result: fail
      - test: conf-test:time-parse-005            # "T23" basic h
        result: fail
      - test: conf-test:time-parse-006            # "T232030,5" basic fraction second
        result: fail
        notes: "Basic format with comma decimal separator not supported"
      - test: conf-test:time-parse-008            # "T2320,8" basic fraction minute
        result: fail
      - test: conf-test:time-parse-010            # "T23.3" basic fraction hour
        result: fail

      # --- Parsing: extended format (passes) ---
      - test: conf-test:time-parse-002            # "T23:20:50" extended full
        result: pass
        actual:
          returned: '"23:20:50"'
      - test: conf-test:time-parse-004            # "23:20" extended hm
        result: pass
        actual:
          returned: '"23:20"'
      - test: conf-test:time-parse-007            # "23:20:30.5" extended fraction
        result: pass
        actual:
          returned: "nsec=500000000"
      - test: conf-test:time-parse-009            # "23:20,8" extended fraction minute
        result: pass
        notes: "Ruby Time.parse handles comma decimal separator in extended format"

      # --- Parsing: beginning/ending of day ---
      - test: conf-test:time-parse-011            # "T000000" basic midnight
        result: fail
      - test: conf-test:time-parse-012            # "00:00:00" extended midnight
        result: pass
        actual:
          returned: '"00:00:00"'
      - test: conf-test:time-parse-013            # "T240000" basic end-of-day
        result: fail
      - test: conf-test:time-parse-014            # "24:00:00" extended end-of-day
        result: fail
        notes: "Time.parse does not accept hour 24"
      - test: conf-test:time-parse-028            # "T00" reduced midnight
        result: fail
      - test: conf-test:time-parse-029            # "T00:00" reduced midnight
        result: fail
      - test: conf-test:time-parse-030            # "T24" reduced end-of-day
        result: fail
      - test: conf-test:time-parse-031            # "24:00" reduced end-of-day
        result: fail
      - test: conf-test:time-parse-032            # "T000000.000" midnight fraction
        result: fail
      - test: conf-test:time-parse-033            # "T240000.000" end-of-day fraction
        result: fail

      # --- Parsing: UTC ---
      - test: conf-test:time-parse-015            # "T232030Z" basic UTC
        result: fail
      - test: conf-test:time-parse-016            # "23:20:30Z" extended UTC
        result: pass
        actual:
          returned: "utc_offset=0"
      - test: conf-test:time-parse-017            # "T2320Z" basic UTC reduced
        result: fail
      - test: conf-test:time-parse-018            # "T23Z" basic UTC hours
        result: fail
      - test: conf-test:time-parse-019            # "23:20Z" extended UTC reduced
        result: pass

      # --- Parsing: UTC offsets ---
      - test: conf-test:time-parse-020            # "T152746+0100" basic positive
        result: fail
      - test: conf-test:time-parse-021            # "T152746-0500" basic negative
        result: fail
      - test: conf-test:time-parse-022            # "15:27:46+01:00" extended positive
        result: pass
        actual:
          returned: "utc_offset=3600"
      - test: conf-test:time-parse-023            # "15:27:46-05:00" extended negative
        result: pass
        actual:
          returned: "utc_offset=-18000"
      - test: conf-test:time-parse-024            # "T152746+01" basic hours-only
        result: fail
      - test: conf-test:time-parse-025            # "T152746-05" basic hours-only
        result: fail
      - test: conf-test:time-parse-026            # "15:27:46+01" extended hours-only
        result: pass
      - test: conf-test:time-parse-027            # "15:27:46-05" extended hours-only
        result: pass

      # --- Parsing: leap second ---
      - test: conf-test:time-parse-034            # "T235960" leap second
        result: fail
        notes: "Ruby Time does not support leap seconds (second=60)"

      # --- Generation ---
      - test: conf-test:time-gen-001              # basic "T232050"
        result: pass
        method:
          code: 'Time.new(2023, 1, 1, 23, 20, 50).strftime("T%H%M%S")'
          api: Time#strftime
        actual:
          returned: '"T232050"'
      - test: conf-test:time-gen-002              # extended "T23:20:50"
        result: pass
        method:
          code: 'Time.new(2023, 1, 1, 23, 20, 50).strftime("T%H:%M:%S")'
          api: Time#strftime
        actual:
          returned: '"T23:20:50"'
      - test: conf-test:time-gen-003              # basic "T2320"
        result: pass
        method:
          code: 'Time.new(2023, 1, 1, 23, 20, 0).strftime("T%H%M")'
          api: Time#strftime
        actual:
          returned: '"T2320"'
      - test: conf-test:time-gen-004              # extended "23:20"
        result: pass
        method:
          code: 'Time.new(2023, 1, 1, 23, 20, 0).strftime("%H:%M")'
          api: Time#strftime
        actual:
          returned: '"23:20"'
      - test: conf-test:time-gen-005              # basic UTC "T232030Z"
        result: pass
        method:
          code: 'Time.utc(2023, 1, 1, 23, 20, 30).strftime("T%H%M%SZ")'
          api: Time.utc
        actual:
          returned: '"T232030Z"'
      - test: conf-test:time-gen-006              # extended UTC "T23:20:30Z"
        result: pass
        method:
          code: 'Time.utc(2023, 1, 1, 23, 20, 30).strftime("T%H:%M:%SZ")'
          api: Time.utc
        actual:
          returned: '"T23:20:30Z"'
      - test: conf-test:time-gen-007              # basic positive offset "T152746+0100"
        result: pass
        method:
          code: 'Time.new(2023, 1, 1, 15, 27, 46, "+01:00").strftime("T%H%M%S%z")'
          api: Time.new
        actual:
          returned: '"T152746+0100"'
      - test: conf-test:time-gen-008              # extended positive offset
        result: pass
        method:
          code: 'Time.new(2023, 1, 1, 15, 27, 46, "+01:00").strftime("%H:%M:%S%z")'
          api: Time.new
        actual:
          returned: '"15:27:46+0100"'
      - test: conf-test:time-gen-009              # basic negative offset "T152746-0500"
        result: pass
        method:
          code: 'Time.new(2023, 1, 1, 15, 27, 46, "-05:00").strftime("T%H%M%S%z")'
          api: Time.new
        actual:
          returned: '"T152746-0500"'
      - test: conf-test:time-gen-010              # extended negative offset
        result: pass
        method:
          code: 'Time.new(2023, 1, 1, 15, 27, 46, "-05:00").strftime("%H:%M:%S%z")'
          api: Time.new
        actual:
          returned: '"15:27:46-0500"'

      # --- Validity ---
      - test: conf-test:time-valid-001            # "T250000" hour 25
        result: pass
        method:
          code: 'Time.new(2023, 1, 1, 25, 0, 0) rescue "error"'
          api: Time.new
        actual:
          valid: false
      - test: conf-test:time-valid-002            # "T236000" minute 60
        result: pass
        method:
          code: 'Time.new(2023, 1, 1, 23, 60, 0) rescue "error"'
          api: Time.new
        actual:
          valid: false
      - test: conf-test:time-valid-003            # "T235961" second 61
        result: pass
        method:
          code: 'Time.new(2023, 1, 1, 23, 59, 61) rescue "error"'
          api: Time.new
        actual:
          valid: false
      - test: conf-test:time-valid-004            # "T240001" hour 24 with minutes
        result: pass
        method:
          code: 'Time.new(2023, 1, 1, 24, 0, 1) rescue "error"'
          api: Time.new
        actual:
          valid: false
      - test: conf-test:time-valid-005            # "T240001" hour 24 with seconds
        result: pass
      - test: conf-test:time-valid-006            # "T1920" ambiguity
        result: pass
        notes: "Time.parse can handle time designator disambiguation"

      # --- Equivalence ---
      - test: conf-test:time-equiv-001
        result: pass
      - test: conf-test:time-equiv-002
        result: pass

  # ================================================================
  # CONFORMANCE CLASS: date-and-time (45 tests)
  # Status: PARTIAL — DateTime.parse handles date+time combinations
  # with offsets in extended format. Basic format not supported.
  # Week-date+time and ordinal-date+time not supported by parsing.
  # ================================================================
  - conformance_class: conf-class:date-and-time
    status: partial
    notes: >-
      DateTime.parse handles calendar date + time in extended format with
      UTC offsets. Basic format (YYYYMMDDThhmmss) may work but without
      time designator. Week-date+time and ordinal-date+time parsing
      not supported. Expanded year combined with time not supported.
    default_method:
      language: ruby
      code: 'DateTime.parse("{expression}")'
      api: DateTime.parse
    test_results:
      # --- Parsing: basic calendar date + time ---
      - test: conf-test:date-time-parse-001       # "19850412T232030" basic
        result: fail
        notes: "DateTime.parse may not parse basic format correctly"
      - test: conf-test:date-time-parse-002       # "19850412T232030Z" basic UTC
        result: fail
      - test: conf-test:date-time-parse-003       # "19850412T232030+0400" basic offset
        result: fail
      - test: conf-test:date-time-parse-004       # "19850412T232030+04" basic hours
        result: fail

      # --- Parsing: extended calendar date + time ---
      - test: conf-test:date-time-parse-005       # "1985-04-12T23:20:30"
        result: pass
        actual:
