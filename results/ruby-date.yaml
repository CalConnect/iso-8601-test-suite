      - test: conf-test:ord-date-parse-003        # "+001985102"
        result: fail
        notes: "Expanded year + ordinal format not supported"
      - test: conf-test:ord-date-parse-004        # "+001985-102"
        result: fail
        notes: "Expanded year + ordinal format not supported"
      - test: conf-test:ord-date-parse-005        # "1985001" Jan 1
        result: pass
