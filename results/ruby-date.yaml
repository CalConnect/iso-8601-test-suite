      - test: conf-test:date-time-parse-012       # "1985102T232030+04"
        result: fail
      - test: conf-test:date-time-parse-013       # "1985-102T23:20:30" extended ordinal
        result: fail
      - test: conf-test:date-time-parse-014       # "1985-102T23:20:30Z"
