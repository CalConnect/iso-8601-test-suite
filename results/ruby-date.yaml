  # ================================================================
  # PROFILE RESULTS — Additional profile-specific tests
  # These tests cover profile restrictions beyond the base
  # conformance classes (e.g., extended-format-only, mandatory T).
  # ================================================================

profile_results:
  # ── RFC 3339 (9 additional tests) ──
  - profile: profile:rfc-3339
    status: partial
    notes: >-
      Ruby Date/Time handles extended-format RFC 3339 timestamps but is not
      a strict validator — it accepts some non-RFC-3339 inputs and rejects
      others inconsistently.
    test_results:
      - test: conf-test:rfc-3339-valid-001
        result: pass
        method:
          code: 'Time.parse("1985-04-12T23:20:50.52Z").iso8601'
          language: ruby
          api: Time.parse
        actual:
          valid: true
      - test: conf-test:rfc-3339-valid-002
        result: pass
        method:
          code: 'Time.parse("1985-04-12T23:20:50+02:00").iso8601'
          language: ruby
          api: Time.parse
        actual:
          valid: true
      - test: conf-test:rfc-3339-valid-003
        result: pass
        method:
          code: 'Time.parse("1996-12-19T16:39:57-08:00").iso8601'
          language: ruby
          api: Time.parse
        actual:
          valid: true
      - test: conf-test:rfc-3339-invalid-001
        result: fail
        notes: >-
          Time.parse accepts basic format "19850412T232050Z" — Ruby is not
          a strict RFC 3339 validator.
        method:
          code: 'begin; Time.parse("19850412T232050Z"); true; rescue => e; false; end'
          language: ruby
          api: Time.parse
        actual:
          valid: true
      - test: conf-test:rfc-3339-invalid-002
        result: fail
        notes: "Time.parse accepts lowercase 't' designator"
        method:
          code: 'begin; Time.parse("1985-04-12t23:20:50Z"); true; rescue => e; false; end'
          language: ruby
          api: Time.parse
        actual:
          valid: true
      - test: conf-test:rfc-3339-invalid-003
        result: fail
        notes: "Time.parse accepts time without seconds (hh:mm only)"
        method:
          code: 'begin; Time.parse("1985-04-12T23:20Z"); true; rescue => e; false; end'
          language: ruby
          api: Time.parse
        actual:
          valid: true
      - test: conf-test:rfc-3339-invalid-004
        result: pass
        notes: "Time.parse rejects hour 24"
        method:
          code: 'begin; Time.parse("1985-04-12T24:00:00Z"); true; rescue => e; false; end'
          language: ruby
          api: Time.parse
        actual:
          valid: false
      - test: conf-test:rfc-3339-invalid-005
        result: fail
        notes: "Date.parse accepts date-only '1985-04-12' — not strict RFC 3339"
        method:
          code: 'begin; Date.parse("1985-04-12"); true; rescue => e; false; end'
          language: ruby
          api: Date.parse
        actual:
          valid: true
      - test: conf-test:rfc-3339-invalid-006
        result: fail
        notes: "Date.parse accepts year-month '1985-04' — not strict RFC 3339"
        method:
          code: 'begin; Date.parse("1985-04"); true; rescue => e; false; end'
          language: ruby
          api: Date.parse
        actual:
          valid: true

  # ── EDTF Level 0 (10 additional tests) ──
  - profile: profile:edtf-level-0
    status: partial
    notes: >-
      EDTF Level 0 is a subset of ISO 8601-1 extended format. Ruby handles
      the extended-format and four-digit-year tests but is not a strict
      validator — accepts inputs that EDTF Level 0 would reject.
    test_results:
      - test: conf-test:edtf-level-0-valid-001
        result: pass
        notes: "Extended year-month accepted"
      - test: conf-test:edtf-level-0-valid-002
        result: pass
        notes: "Extended full date accepted"
      - test: conf-test:edtf-level-0-valid-003
        result: pass
        notes: "Date-time with Z accepted"
      - test: conf-test:edtf-level-0-valid-004
        result: pass
        notes: "Date-time with numeric offset accepted"
      - test: conf-test:edtf-level-0-invalid-001
        result: fail
        notes: "Date.parse accepts basic format '20100101'"
      - test: conf-test:edtf-level-0-invalid-002
        result: fail
        notes: "Date.parse accepts basic format '201001'"
      - test: conf-test:edtf-level-0-invalid-003
        result: fail
        notes: "Time.parse accepts hour-only time '2010-01-01T00Z'"
      - test: conf-test:edtf-level-0-invalid-004
        result: fail
        notes: "Time.parse accepts offset without minutes '+01'"
      - test: conf-test:edtf-level-0-invalid-005
        result: pass
        notes: "Time.parse rejects hour 24"
      - test: conf-test:edtf-level-0-invalid-006
        result: pass
        notes: "Date.parse rejects expanded year '+002010'"

  # ── EDTF Level 1 (19 additional tests) ──
  - profile: profile:edtf-level-1
    status: not-supported
    notes: >-
      EDTF Level 1 requires qualification markers (?), unspecified digits
      (XX), and season codes — none of which are supported by Ruby stdlib.
      The base ISO 8601-1 extended-format tests that overlap with Level 0
      behave the same as EDTF Level 0.
    test_results:
      - { test: conf-test:edtf-level-1-valid-001, result: not-supported }
      - { test: conf-test:edtf-level-1-valid-002, result: not-supported }
      - { test: conf-test:edtf-level-1-valid-003, result: not-supported }
      - { test: conf-test:edtf-level-1-valid-004, result: not-supported }
      - { test: conf-test:edtf-level-1-valid-005, result: not-supported }
      - { test: conf-test:edtf-level-1-valid-006, result: not-supported }
      - { test: conf-test:edtf-level-1-invalid-001, result: not-supported }
      - { test: conf-test:edtf-level-1-invalid-002, result: not-supported }
      - { test: conf-test:edtf-level-1-valid-007, result: pass, notes: "Extended format date accepted" }
      - { test: conf-test:edtf-level-1-invalid-003, result: fail, notes: "Date.parse accepts basic format" }
      - { test: conf-test:edtf-level-1-valid-008, result: pass, notes: "Four-digit year accepted" }
      - { test: conf-test:edtf-level-1-valid-009, result: pass, notes: "Date-time with T accepted" }
      - { test: conf-test:edtf-level-1-invalid-004, result: fail, notes: "Time.parse accepts space separator" }
      - { test: conf-test:edtf-level-1-valid-010, result: pass, notes: "Time with hours and minutes accepted" }
      - { test: conf-test:edtf-level-1-invalid-005, result: fail, notes: "Time.parse accepts hour-only time" }
      - { test: conf-test:edtf-level-1-valid-011, result: pass, notes: "Hour 23 accepted" }
      - { test: conf-test:edtf-level-1-invalid-006, result: pass, notes: "Time.parse rejects hour 24" }
      - { test: conf-test:edtf-level-1-valid-012, result: pass, notes: "UTC offset with minutes accepted" }
      - { test: conf-test:edtf-level-1-invalid-007, result: fail, notes: "Time.parse accepts offset without minutes" }

  # ── EDTF Level 2 (24 additional tests) ──
  - profile: profile:edtf-level-2
    status: not-supported
    notes: >-
      EDTF Level 2 adds partial uncertain/approximate qualification,
      unspecified digits, set/range notation, and exponential values —
      none supported by Ruby stdlib. Only the base ISO 8601-1 tests
      that overlap with Level 0/1 behave the same.
    test_results:
