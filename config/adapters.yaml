# yaml-language-server: $schema=adapters-schema.yaml
#
# Adapter registry for the ISO 8601 capability matrix.
#
# Each entry pins a specific toolchain version so the matrix can compare
# behaviour across versions of the same family (e.g. Ruby 3.0..4.0).
#
# Paths are environment-specific. Edit this file to point at your own
# toolchain installs (mise, asdf, homebrew, system, etc.).

# Toolchain install roots (referenced via interpolation below).
paths:
  mise_root: "~/.local/share/mise/installs"
  ruby_30:  "~/.local/share/mise/installs/ruby/3.0.7/bin/ruby"
  ruby_31:  "~/.local/share/mise/installs/ruby/3.1.6/bin/ruby"
  ruby_32:  "~/.local/share/mise/installs/ruby/3.2.10/bin/ruby"
  ruby_33:  "~/.local/share/mise/installs/ruby/3.3.7/bin/ruby"
  ruby_40:  "~/.local/share/mise/installs/ruby/4.0.5/bin/ruby"
  python38: "~/.local/share/mise/installs/python/3.8.20/bin/python3"
  python39: "~/.local/share/mise/installs/python/3.9.25/bin/python3"
  python310: "~/.local/share/mise/installs/python/3.10.5/bin/python3"
  python312: "~/.local/share/mise/installs/python/3.12.11/bin/python3"
  python313: "~/.local/share/mise/installs/python/3.13.6/bin/python3"
  node18:   "~/.local/share/mise/installs/node/18.20.8/bin/node"
  node20:   "~/.local/share/mise/installs/node/20.20.2/bin/node"
  node22:   "~/.local/share/mise/installs/node/22.20.0/bin/node"
  java8_home:  "/Library/Java/JavaVirtualMachines/adoptopenjdk-8.jdk/Contents/Home"
  java15_home: "/Library/Java/JavaVirtualMachines/adoptopenjdk-15.jdk/Contents/Home"
  java21_home: "~/.local/share/mise/installs/java/openjdk-21.0.2"
  apple_clang_pp:  "/usr/bin/clang++"
  homebrew_llvm_pp: "/opt/homebrew/opt/llvm/bin/clang++"

adapters:
  - id: ruby-30
    name: "Ruby 3.0 Date"
    family: "Ruby Date"
    logo: "/logos/ruby.svg"
    adapter: "exec:${ruby_30} adapters/ruby/date-exec.rb"

  - id: ruby-31
    name: "Ruby 3.1 Date"
    family: "Ruby Date"
    logo: "/logos/ruby.svg"
    adapter: "exec:${ruby_31} adapters/ruby/date-exec.rb"

  - id: ruby-32
    name: "Ruby 3.2 Date"
    family: "Ruby Date"
    logo: "/logos/ruby.svg"
    adapter: "exec:${ruby_32} adapters/ruby/date-exec.rb"

  - id: ruby-33
    name: "Ruby 3.3 Date"
    family: "Ruby Date"
    logo: "/logos/ruby.svg"
    adapter: "exec:${ruby_33} adapters/ruby/date-exec.rb"

  - id: ruby-date
    name: "Ruby 3.4 Date"
    family: "Ruby Date"
    logo: "/logos/ruby.svg"
    adapter: "ruby-date"

  - id: ruby-date-40
    name: "Ruby 4.0 Date"
    family: "Ruby Date"
    logo: "/logos/ruby.svg"
    adapter: "exec:${ruby_40} adapters/ruby/date-exec.rb"

  - id: python-38
    name: "Python 3.8 datetime"
    family: "Python datetime"
    logo: "/logos/python.svg"
    adapter: "exec:${python38} adapters/python/datetime.py"

  - id: python-39
    name: "Python 3.9 datetime"
    family: "Python datetime"
    logo: "/logos/python.svg"
    adapter: "exec:${python39} adapters/python/datetime.py"

  - id: python-datetime
    name: "Python 3.10 datetime"
    family: "Python datetime"
    logo: "/logos/python.svg"
    adapter: "exec:${python310} adapters/python/datetime.py"

  - id: python-312
    name: "Python 3.12 datetime"
    family: "Python datetime"
    logo: "/logos/python.svg"
    adapter: "exec:${python312} adapters/python/datetime.py"

  - id: python-313
    name: "Python 3.13 datetime"
    family: "Python datetime"
    logo: "/logos/python.svg"
    adapter: "exec:${python313} adapters/python/datetime.py"

  - id: node-18
    name: "Node.js 18 Date"
    family: "Node.js Date"
    logo: "/logos/javascript.svg"
    adapter: "exec:${node18} adapters/node/datetime.js"

  - id: node-20
    name: "Node.js 20 Date"
    family: "Node.js Date"
    logo: "/logos/javascript.svg"
    adapter: "exec:${node20} adapters/node/datetime.js"

  - id: node-22
    name: "Node.js 22 Date"
    family: "Node.js Date"
    logo: "/logos/javascript.svg"
    adapter: "exec:${node22} adapters/node/datetime.js"

  - id: node-datetime
    name: "Node.js 24 Date"
    family: "Node.js Date"
    logo: "/logos/javascript.svg"
    adapter: "exec:node adapters/node/datetime.js"

  - id: c-stdio
    name: "C strftime/strptime (BSD)"
    family: "C stdio"
    logo: "/logos/c.svg"
    adapter: "exec:env ADAPTER_LABEL='C strftime/strptime (BSD)' ADAPTER_VERSION='BSD libc' gcc -O2 -Iadapters/c -o /tmp/c-stdio-adapter adapters/c/stdio.c adapters/c/vendor/cjson/cJSON.c && /tmp/c-stdio-adapter"

  - id: c-stdio-glibc
    name: "C strftime/strptime (glibc)"
    family: "C stdio"
    logo: "/logos/c.svg"
    adapter: "exec:docker run --rm -i -v ${repo_root}/adapters:/adapters:ro gcc:15 sh -c 'gcc -O2 -D_GNU_SOURCE -I/adapters/c -o /tmp/c-adapter /adapters/c/stdio.c /adapters/c/vendor/cjson/cJSON.c && ADAPTER_LABEL=\"C strftime/strptime (glibc)\" ADAPTER_VERSION=\"glibc (gcc 15)\" /tmp/c-adapter'"

  - id: cpp-chrono
    name: "C++ std::chrono (LLVM)"
    family: "C++ chrono"
    logo: "/logos/cpp.svg"
    adapter: "exec:${homebrew_llvm_pp} -std=c++20 -O2 -DADAPTER_LABEL='\"C++ std::chrono (LLVM)\"' -o /tmp/cpp-chrono adapters/cpp/chrono.cpp && /tmp/cpp-chrono"

  - id: cpp-chrono-apple
    name: "C++ std::chrono (Apple)"
    family: "C++ chrono"
    logo: "/logos/cpp.svg"
    adapter: "exec:${apple_clang_pp} -std=c++20 -O2 -DADAPTER_LABEL='\"C++ std::chrono (Apple)\"' -o /tmp/cpp-chrono-apple adapters/cpp/chrono.cpp && /tmp/cpp-chrono-apple"

  - id: rust-chrono
    name: "Rust chrono (latest)"
    family: "Rust chrono"
    logo: "/logos/rust.svg"
    adapter: "exec:env ADAPTER_LABEL='Rust chrono (latest)' ADAPTER_VERSION='chrono 0.4 (latest)' adapters/rust/chrono-latest/target/release/rust-chrono"

  - id: rust-chrono-0419
    name: "Rust chrono 0.4.19"
    family: "Rust chrono"
    logo: "/logos/rust.svg"
    adapter: "exec:env ADAPTER_LABEL='Rust chrono 0.4.19' ADAPTER_VERSION='chrono 0.4.19' adapters/rust/chrono-0419/target/release/rust-chrono-0419"

  - id: java-8
    name: "Java 8 java.time"
    family: "Java java.time"
    logo: "/logos/java.svg"
    adapter: "exec:mkdir -p /tmp/java-adapters-8 && ${java8_home}/bin/javac -d /tmp/java-adapters-8 adapters/java/JavaDateTime.java && ${java8_home}/bin/java -cp /tmp/java-adapters-8 JavaDateTime"

  - id: java-15
    name: "Java 15 java.time"
    family: "Java java.time"
    logo: "/logos/java.svg"
    adapter: "exec:mkdir -p /tmp/java-adapters-15 && ${java15_home}/bin/javac -d /tmp/java-adapters-15 adapters/java/JavaDateTime.java && ${java15_home}/bin/java -cp /tmp/java-adapters-15 JavaDateTime"

  - id: java-time
    name: "Java 21 java.time"
    family: "Java java.time"
    logo: "/logos/java.svg"
    adapter: "exec:mkdir -p /tmp/java-adapters-21 && ${java21_home}/bin/javac -d /tmp/java-adapters-21 adapters/java/JavaDateTime.java && ${java21_home}/bin/java -cp /tmp/java-adapters-21 JavaDateTime"
