# yaml-language-server: $schema=meta.yaml
# YAML Schema for ISO 8601 Test Suite — Profile
---
type: object
required:
  - id
  - name
  - standardization_target_type
properties:
  id:
    type: string
    pattern: "^profile:[a-z0-9-]+$"
    description: "Local identifier for this profile (e.g. profile:rfc-3339)"
  name:
    type: string
    description: "Human-readable name"
  description:
    type: string
    description: "Description of the profile"
  source:
    type: array
    items:
      type: string
    description: "RFC 5141 URN or URL references to source specifications"
  standardization_target_type:
    type: string
    description: "The type of implementation being tested"
  conformance_classes:
    type: array
    items:
      type: string
      pattern: "^(8601-[12]:)?conf-class:[a-z0-9-]+$"
    description: "Conformance classes referenced (legacy: prefer traceability)"
  traceability:
    type: array
    items:
      type: object
      required: [conformance_class, requirements]
      properties:
        conformance_class:
          type: string
          pattern: "^(8601-[12]:)?conf-class:[a-z0-9-]+$"
        requirements:
          type: array
          items:
            type: string
            pattern: "^req:[a-z0-9-]+$"
    description: >-
      Traceability matrix: specific requirements selected from each conformance
      class. Replaces conformance_classes with explicit per-class requirement
      selection for precise profile definition.
  additional_requirements:
    type: array
    items:
      type: object
      required: [id, statement]
      properties:
        id:
          type: string
          pattern: "^req:[a-z0-9-]+$"
        statement:
          type: string
    description: "Additional profile-specific requirements"
  additional_tests:
    type: array
    items:
      type: object
      required: [id, description, requirements, test_type, given, expect]
      properties:
        id:
          type: string
          pattern: "^conf-test:[a-z0-9-]+$"
        description:
          type: string
        requirements:
          type: array
          items:
            type: string
        test_type:
          type: string
          enum: [parsing, generation, validity, equivalence, arithmetic, round_trip]
        parse_mode:
          type: string
          enum: [dedicated, undifferentiated]
          description: >-
            For parsing/validity tests: which parser mode to use.
            Defaults to "dedicated" if omitted.
        given:
          oneOf:
            - type: object
              required: [expression]
              properties:
                expression:
                  type: string
            - type: object
              required: [components]
              properties:
                components:
                  type: object
            - type: object
              required: [expression_a, expression_b]
              properties:
                expression_a:
                  type: string
                expression_b:
                  type: string
            - type: object
              required: [expression, operation]
              properties:
                expression:
                  type: string
                operation:
                  type: string
                  enum: [add, subtract]
                operand:
                  type: object
        expect:
          oneOf:
            - type: object
              required: [valid]
              properties:
                valid:
                  type: boolean
                components:
                  type: object
            - type: object
              required: [expression]
              properties:
                expression:
                  type: string
            - type: object
              required: [equivalent]
              properties:
                equivalent:
                  type: boolean
    description: "Additional profile-specific conformance tests"
