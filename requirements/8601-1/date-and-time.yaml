# yaml-language-server: $schema=../../schema/requirements-class.yaml
---
id: req-class:date-and-time
name: Date and time of day
description: >
  Requirements for the representation of date and time of day combinations,
  including calendar date + time, ordinal date + time, and week date + time
  in basic and extended formats, with UTC and offset variants.
standardization_target_type: iso-8601-date-time-processor
dependencies:
  - req-class:calendar-date
  - req-class:time-of-day
source:
  - urn:iso:std:iso:8601:-1:ed-1:en:clause:5.4
requirements:
  - id: req:date-time-cal-basic-local
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.4.2.1:tech:date-time-cal-basic-local"
    statement: >
      A calendar date combined with local time in basic format concatenates
      the date and time fields with a time designator: [date]["T"][time].
    format: basic
    pattern: "[YYYY][MM][DD][\"T\"][hh][mm][ss]"
  - id: req:date-time-cal-basic-utc
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.4.2.1:tech:date-time-cal-basic-utc"
    statement: >
      A calendar date combined with UTC time in basic format appends the UTC
      designator after the time: [date]["T"][time]["Z"].
    format: basic
    pattern: "[YYYY][MM][DD][\"T\"][hh][mm][ss][\"Z\"]"
  - id: req:date-time-cal-basic-offset
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.4.2.1:tech:date-time-cal-basic-offset"
    statement: >
      A calendar date combined with time and a full UTC offset (hours and minutes)
      in basic format appends the offset after the time: [date]["T"][time]["±"][hh][mm].
    format: basic
    pattern: "[YYYY][MM][DD][\"T\"][hh][mm][ss][±][hh][mm]"
  - id: req:date-time-cal-basic-shift-h
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.4.2.1:tech:date-time-cal-basic-shift-h"
    statement: >
      A calendar date combined with time and a reduced UTC offset (hours only,
      minutes omitted as zero) in basic format appends ["±"][hh] after the time:
      [date]["T"][time]["±"][hh].
    format: basic
    pattern: "[YYYY][MM][DD][\"T\"][hh][mm][ss][±][hh]"
  - id: req:date-time-cal-extended-local
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.4.2.1:tech:date-time-cal-extended-local"
    statement: >
      A calendar date combined with local time in extended format uses hyphen
      separators in the date and colon separators in the time:
      [dateX]["T"][timeX].
    format: extended
    pattern: "[YYYY][\"-\"][MM][\"-\"][DD][\"T\"][hh][\":\"][mm][\":\"][ss]"
  - id: req:date-time-cal-extended-utc
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.4.2.1:tech:date-time-cal-extended-utc"
    statement: >
      A calendar date combined with UTC time in extended format appends the UTC
      designator: [dateX]["T"][timeX]["Z"].
    format: extended
    pattern: "[YYYY][\"-\"][MM][\"-\"][DD][\"T\"][hh][\":\"][mm][\":\"][ss][\"Z\"]"
  - id: req:date-time-cal-extended-offset
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.4.2.1:tech:date-time-cal-extended-offset"
    statement: >
      A calendar date combined with time and a full UTC offset (hours and minutes)
      in extended format appends the offset with colon separator:
      [dateX]["T"][timeX]["±"][hh][":"][mm].
    format: extended
    pattern: "[YYYY][\"-\"][MM][\"-\"][DD][\"T\"][hh][\":\"][mm][\":\"][ss][±][hh][\":\"][mm]"
  - id: req:date-time-cal-extended-shift-h
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.4.2.1:tech:date-time-cal-extended-shift-h"
    statement: >
      A calendar date combined with time and a reduced UTC offset (hours only,
      minutes omitted as zero) in extended format appends ["±"][hh] after the time:
      [dateX]["T"][timeX]["±"][hh].
    format: extended
    pattern: "[YYYY][\"-\"][MM][\"-\"][DD][\"T\"][hh][\":\"][mm][\":\"][ss][±][hh]"
  - id: req:date-time-ord-basic-local
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.4.2.2:tech:date-time-ord-basic-local"
    statement: >
      An ordinal date combined with local time in basic format concatenates
      the date and time with a time designator: [odate]["T"][time].
    format: basic
    pattern: "[YYYY][OOO][\"T\"][hh][mm][ss]"
  - id: req:date-time-ord-basic-utc
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.4.2.2:tech:date-time-ord-basic-utc"
    statement: >
      An ordinal date combined with UTC time in basic format appends the UTC
      designator: [odate]["T"][time]["Z"].
    format: basic
    pattern: "[YYYY][OOO][\"T\"][hh][mm][ss][\"Z\"]"
  - id: req:date-time-ord-basic-offset
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.4.2.2:tech:date-time-ord-basic-offset"
    statement: >
      An ordinal date combined with time and a full UTC offset (hours and minutes)
      in basic format appends the offset: [odate]["T"][time]["±"][hh][mm].
    format: basic
    pattern: "[YYYY][OOO][\"T\"][hh][mm][ss][±][hh][mm]"
  - id: req:date-time-ord-basic-shift-h
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.4.2.2:tech:date-time-ord-basic-shift-h"
    statement: >
      An ordinal date combined with time and a reduced UTC offset (hours only)
      in basic format appends ["±"][hh] after the time: [odate]["T"][time]["±"][hh].
    format: basic
    pattern: "[YYYY][OOO][\"T\"][hh][mm][ss][±][hh]"
  - id: req:date-time-ord-extended-local
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.4.2.2:tech:date-time-ord-extended-local"
    statement: >
      An ordinal date combined with local time in extended format uses hyphen
      and colon separators: [odateX]["T"][timeX].
    format: extended
    pattern: "[YYYY][\"-\"][OOO][\"T\"][hh][\":\"][mm][\":\"][ss]"
  - id: req:date-time-ord-extended-utc
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.4.2.2:tech:date-time-ord-extended-utc"
    statement: >
      An ordinal date combined with UTC time in extended format appends the UTC
      designator: [odateX]["T"][timeX]["Z"].
    format: extended
    pattern: "[YYYY][\"-\"][OOO][\"T\"][hh][\":\"][mm][\":\"][ss][\"Z\"]"
  - id: req:date-time-ord-extended-offset
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.4.2.2:tech:date-time-ord-extended-offset"
    statement: >
      An ordinal date combined with time and a full UTC offset (hours and minutes)
      in extended format appends the offset with colon separator:
      [odateX]["T"][timeX]["±"][hh][":"][mm].
    format: extended
    pattern: "[YYYY][\"-\"][OOO][\"T\"][hh][\":\"][mm][\":\"][ss][±][hh][\":\"][mm]"
  - id: req:date-time-ord-extended-shift-h
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.4.2.2:tech:date-time-ord-extended-shift-h"
    statement: >
      An ordinal date combined with time and a reduced UTC offset (hours only)
      in extended format appends ["±"][hh] after the time: [odateX]["T"][timeX]["±"][hh].
    format: extended
    pattern: "[YYYY][\"-\"][OOO][\"T\"][hh][\":\"][mm][\":\"][ss][±][hh]"
  - id: req:date-time-week-basic-local
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.4.2.3:tech:date-time-week-basic-local"
    statement: >
      A week date combined with local time in basic format concatenates the date
      and time with a time designator: [wdate]["T"][time].
    format: basic
    pattern: "[YYYY][\"W\"][WW][K][\"T\"][hh][mm][ss]"
  - id: req:date-time-week-basic-utc
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.4.2.3:tech:date-time-week-basic-utc"
    statement: >
      A week date combined with UTC time in basic format appends the UTC
      designator: [wdate]["T"][time]["Z"].
    format: basic
    pattern: "[YYYY][\"W\"][WW][K][\"T\"][hh][mm][ss][\"Z\"]"
  - id: req:date-time-week-basic-offset
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.4.2.3:tech:date-time-week-basic-offset"
    statement: >
      A week date combined with time and a full UTC offset (hours and minutes)
      in basic format appends the offset: [wdate]["T"][time]["±"][hh][mm].
    format: basic
    pattern: "[YYYY][\"W\"][WW][K][\"T\"][hh][mm][ss][±][hh][mm]"
  - id: req:date-time-week-basic-shift-h
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.4.2.3:tech:date-time-week-basic-shift-h"
    statement: >
      A week date combined with time and a reduced UTC offset (hours only)
      in basic format appends ["±"][hh] after the time: [wdate]["T"][time]["±"][hh].
    format: basic
    pattern: "[YYYY][\"W\"][WW][K][\"T\"][hh][mm][ss][±][hh]"
  - id: req:date-time-week-extended-local
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.4.2.3:tech:date-time-week-extended-local"
    statement: >
      A week date combined with local time in extended format uses hyphen and
      colon separators: [wdateX]["T"][timeX].
    format: extended
    pattern: "[YYYY][\"-\"][\"W\"][WW][\"-\"][K][\"T\"][hh][\":\"][mm][\":\"][ss]"
  - id: req:date-time-week-extended-utc
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.4.2.3:tech:date-time-week-extended-utc"
    statement: >
      A week date combined with UTC time in extended format appends the UTC
      designator: [wdateX]["T"][timeX]["Z"].
    format: extended
    pattern: "[YYYY][\"-\"][\"W\"][WW][\"-\"][K][\"T\"][hh][\":\"][mm][\":\"][ss][\"Z\"]"
  - id: req:date-time-week-extended-offset
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.4.2.3:tech:date-time-week-extended-offset"
    statement: >
      A week date combined with time and a full UTC offset (hours and minutes)
      in extended format appends the offset with colon separator:
      [wdateX]["T"][timeX]["±"][hh][":"][mm].
    format: extended
    pattern: "[YYYY][\"-\"][\"W\"][WW][\"-\"][K][\"T\"][hh][\":\"][mm][\":\"][ss][±][hh][\":\"][mm]"
  - id: req:date-time-week-extended-shift-h
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.4.2.3:tech:date-time-week-extended-shift-h"
    statement: >
      A week date combined with time and a reduced UTC offset (hours only)
      in extended format appends ["±"][hh] after the time: [wdateX]["T"][timeX]["±"][hh].
    format: extended
    pattern: "[YYYY][\"-\"][\"W\"][WW][\"-\"][K][\"T\"][hh][\":\"][mm][\":\"][ss][±][hh]"
  - id: req:date-time-cal-basic-reduced-hm
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.4.3:tech:date-time-cal-basic-reduced-hm"
    statement: >
      A calendar date in basic format may be combined with a time reduced to
      hour and minute (no seconds): [date]["T"][hh][mm].
    format: basic
    pattern: "[YYYY][MM][DD][\"T\"][hh][mm]"
  - id: req:date-time-cal-extended-reduced-hm
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.4.3:tech:date-time-cal-extended-reduced-hm"
    statement: >
      A calendar date in extended format may be combined with a time reduced to
      hour and minute (no seconds): [dateX]["T"][hh][":"][mm].
    format: extended
    pattern: "[YYYY][\"-\"][MM][\"-\"][DD][\"T\"][hh][\":\"][mm]"
  - id: req:date-time-ord-basic-reduced-hm
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.4.3:tech:date-time-ord-basic-reduced-hm"
    statement: >
      An ordinal date in basic format may be combined with a time reduced to
      hour and minute: [odate]["T"][hh][mm].
    format: basic
    pattern: "[YYYY][OOO][\"T\"][hh][mm]"
  - id: req:date-time-ord-extended-reduced-hm
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.4.3:tech:date-time-ord-extended-reduced-hm"
    statement: >
      An ordinal date in extended format may be combined with a time reduced to
      hour and minute: [odateX]["T"][hh][":"][mm].
    format: extended
    pattern: "[YYYY][\"-\"][OOO][\"T\"][hh][\":\"][mm]"
  - id: req:date-time-week-basic-reduced-hm
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.4.3:tech:date-time-week-basic-reduced-hm"
    statement: >
      A week date in basic format may be combined with a time reduced to
      hour and minute: [wdate]["T"][hh][mm].
    format: basic
    pattern: "[YYYY][\"W\"][WW][K][\"T\"][hh][mm]"
  - id: req:date-time-week-extended-reduced-hm
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.4.3:tech:date-time-week-extended-reduced-hm"
    statement: >
      A week date in extended format may be combined with a time reduced to
      hour and minute: [wdateX]["T"][hh][":"][mm].
    format: extended
    pattern: "[YYYY][\"-\"][\"W\"][WW][\"-\"][K][\"T\"][hh][\":\"][mm]"
  - id: req:date-time-format-consistency
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.4.3:tech:date-time-format-consistency"
    statement: >
      The date and time components of a date-and-time expression shall use
      a consistent format: either entirely basic (no separators) or entirely
      extended (with separators). A mixed expression such as basic date with
      extended time, or vice versa, is invalid.
    format: any
