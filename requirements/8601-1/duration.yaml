# yaml-language-server: $schema=../../schema/requirements-class.yaml
---
id: req-class:duration
name: Duration
description: >
  Requirements for the representation of durations, including the complete
  PnYnMnDTnHnMnS format, week-only format PnW, representations other than
  complete, decimal fractions, and the alternative date-time form.
standardization_target_type: iso-8601-date-time-processor
dependencies:
  - req-class:fundamentals
source:
  - urn:iso:std:iso:8601:-1:ed-1:en:clause:5.5.2
requirements:
  - id: req:dur-complete-datetime
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.5.2.2:tech:dur-complete-datetime"
    statement: >
      A complete duration expression uses the period designator followed by
      date and time unit groups:
      ["P"][i]["Y"][i]["M"][i]["D"]["T"][i]["H"][i]["M"][i]["S"],
      where each [i] is a positive integer.
    format: any
    pattern: "[\"P\"][i][\"Y\"][i][\"M\"][i][\"D\"][\"T\"][i][\"H\"][i][\"M\"][i][\"S\"]"
  - id: req:dur-complete-week
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.5.2.2:tech:dur-complete-week"
    statement: >
      A duration may also be expressed using only weeks: ["P"][i]["W"].
      Week-based and date-time-based expressions are mutually exclusive within
      a single duration.
    format: any
    pattern: "[\"P\"][i][\"W\"]"
  - id: req:dur-reduced-year-omitted
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.5.2.3:tech:dur-reduced-year-omitted"
    statement: >
      In a duration expression, the year component [n]["Y"] may be omitted
      when its value is zero. When years are omitted, the duration begins
      with ["P"] followed by the next present component.
    format: any
    pattern: "[\"P\"](![i][\"Y\"])[i][\"M\"]…"
  - id: req:dur-reduced-month-omitted
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.5.2.3:tech:dur-reduced-month-omitted"
    statement: >
      In a duration expression, the month component [n]["M"] may be omitted
      when its value is zero, provided at least one date-unit component
      remains or only time-unit components follow.
    format: any
  - id: req:dur-reduced-day-omitted
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.5.2.3:tech:dur-reduced-day-omitted"
    statement: >
      In a duration expression, the day component [n]["D"] may be omitted
      when its value is zero. When no date-unit components remain, the time
      designator ["T"] follows ["P"] directly.
    format: any
  - id: req:dur-reduced-hour-omitted
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.5.2.3:tech:dur-reduced-hour-omitted"
    statement: >
      In a duration expression, the hour component [n]["H"] may be omitted
      when its value is zero. When all time-unit components are absent, the
      ["T"] designator is also omitted.
    format: any
  - id: req:dur-reduced-minute-omitted
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.5.2.3:tech:dur-reduced-minute-omitted"
    statement: >
      In a duration expression, the minute component [n]["M"] may be omitted
      when its value is zero, provided at least one time-unit component
      remains present.
    format: any
  - id: req:dur-reduced-second-omitted
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.5.2.3:tech:dur-reduced-second-omitted"
    statement: >
      In a duration expression, the second component [n]["S"] may be omitted
      when its value is zero. The second is the lowest-order time-unit
      component and may be omitted without affecting higher components.
    format: any
  - id: req:dur-reduced-at-least-one-required
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.5.2.3:tech:dur-reduced-at-least-one-required"
    statement: >
      A duration expression shall contain at least one component consisting
      of a non-negative integer followed by a designator (["Y"], ["M"], ["D"],
      ["H"], ["M"], ["S"], or ["W"]). A duration with no value-designator
      pairs is invalid.
    format: any
  - id: req:dur-fraction-period
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.5.2.3:tech:dur-fraction-period"
    statement: >
      The lowest-order component of a duration may include a decimal fraction
      separated from the integer part by a period (decimal point) with at
      least one fractional digit, e.g. ["P"][i]["."][f]["Y"].
    format: any
    pattern: "[i][\".\"][f][unit]"
  - id: req:dur-fraction-comma
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.5.2.3:tech:dur-fraction-comma"
    statement: >
      As an alternative to the decimal point, the lowest-order component of
      a duration may include a decimal fraction separated by a comma with at
      least one fractional digit, e.g. ["P"][i][","][f]["Y"].
    format: any
    pattern: "[i][\",\"][f][unit]"
  - id: req:dur-fraction-leading-zero
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.5.2.3:tech:dur-fraction-leading-zero"
    statement: >
      When the integer part of the lowest-order component of a duration is
      zero and the component is expressed with a decimal fraction, the
      leading zero shall be written, e.g. ["P"]["T"]["0"]["."][f]["S"].
    format: any
    pattern: "[\"0\"][\".\"][f][unit]"
  - id: req:dur-time-designator
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.5.2.3:tech:dur-time-designator"
    statement: >
      The time designator ["T"] separates date-unit components from time-unit
      components within a duration. If no time components are present, the time
      designator is omitted.
    format: any
  - id: req:dur-alt-calendar-basic
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.5.2.4:tech:dur-alt-calendar-basic"
    statement: >
      By mutual agreement, a duration may use the alternative form with calendar
      date in basic format: ["P"][date]["T"][time].
    format: basic
    pattern: "[\"P\"][YYYY][MM][DD][\"T\"][hh][mm][ss]"
  - id: req:dur-alt-calendar-extended
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.5.2.4:tech:dur-alt-calendar-extended"
    statement: >
      By mutual agreement, a duration may use the alternative form with calendar
      date in extended format: ["P"][dateX]["T"][timeX].
    format: extended
    pattern: "[\"P\"][YYYY][\"-\"][MM][\"-\"][DD][\"T\"][hh][\":\"][mm][\":\"][ss]"
  - id: req:dur-alt-ordinal-basic
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.5.2.4:tech:dur-alt-ordinal-basic"
    statement: >
      By mutual agreement, a duration may use the alternative form with ordinal
      date in basic format: ["P"][odate]["T"][time].
    format: basic
    pattern: "[\"P\"][YYYY][OOO][\"T\"][hh][mm][ss]"
  - id: req:dur-alt-ordinal-extended
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.5.2.4:tech:dur-alt-ordinal-extended"
    statement: >
      By mutual agreement, a duration may use the alternative form with ordinal
      date in extended format: ["P"][odateX]["T"][timeX].
    format: extended
    pattern: "[\"P\"][YYYY][\"-\"][OOO][\"T\"][hh][\":\"][mm][\":\"][ss]"
