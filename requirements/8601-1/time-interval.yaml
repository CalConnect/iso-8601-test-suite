# yaml-language-server: $schema=../../schema/requirements-class.yaml
---
id: req-class:time-interval
name: Time interval
description: >
  Requirements for the representation of time intervals, expressed by start/end,
  start/duration, or duration/end, in basic and extended formats.
standardization_target_type: iso-8601-date-time-processor
dependencies:
  - req-class:date-and-time
  - req-class:duration
source:
  - urn:iso:std:iso:8601:-1:ed-1:en:clause:5.5
requirements:
  - id: req:interval-start-end-basic
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.5.3.1:tech:interval-start-end-basic"
    statement: >
      A time interval specified by start and end in basic format concatenates
      two date-time expressions with a solidus separator:
      [date]["T"][time]["/"][date]["T"][time].
    format: basic
    pattern: "[date][\"T\"][time][\"/\"][date][\"T\"][time]"
  - id: req:interval-start-end-extended
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.5.3.1:tech:interval-start-end-extended"
    statement: >
      A time interval specified by start and end in extended format concatenates
      two extended date-time expressions with a solidus separator:
      [dateX]["T"][timeX]["/"][dateX]["T"][timeX].
    format: extended
    pattern: "[dateX][\"T\"][timeX][\"/\"][dateX][\"T\"][timeX]"
  - id: req:interval-start-dur-basic
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.5.3.2:tech:interval-start-dur-basic"
    statement: >
      A time interval specified by start and duration in basic format encodes
      the start date-time followed by a solidus and a duration:
      [date]["T"][time]["/"][duration].
    format: basic
    pattern: "[date][\"T\"][time][\"/\"][duration]"
  - id: req:interval-start-dur-extended
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.5.3.2:tech:interval-start-dur-extended"
    statement: >
      A time interval specified by start and duration in extended format encodes
      the start date-time followed by a solidus and a duration:
      [dateX]["T"][timeX]["/"][duration].
    format: extended
    pattern: "[dateX][\"T\"][timeX][\"/\"][duration]"
  - id: req:interval-dur-end-basic
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.5.3.3:tech:interval-dur-end-basic"
    statement: >
      A time interval specified by duration and end in basic format encodes
      a duration followed by a solidus and the end date-time:
      [duration]["/"][date]["T"][time].
    format: basic
    pattern: "[duration][\"/\"][date][\"T\"][time]"
  - id: req:interval-dur-end-extended
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.5.3.3:tech:interval-dur-end-extended"
    statement: >
      A time interval specified by duration and end in extended format encodes
      a duration followed by a solidus and the end date-time:
      [duration]["/"][dateX]["T"][timeX].
    format: extended
    pattern: "[duration][\"/\"][dateX][\"T\"][timeX]"
  - id: req:interval-abbreviated-end-year-omitted
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.5.1:tech:interval-abbreviated-end-year-omitted"
    statement: >
      In a start/end interval, the year of the end expression may be omitted
      when it is unambiguous; the omitted year inherits its value from the
      start expression. The end expression begins with the month component,
      e.g. [start]["/"][MM][-][DD].
    format: any
  - id: req:interval-abbreviated-end-month-omitted
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.5.1:tech:interval-abbreviated-end-month-omitted"
    statement: >
      In a start/end interval, the year and month of the end expression may
      both be omitted when unambiguous; the omitted components inherit their
      values from the start expression. The end expression begins with the
      day component, e.g. [start]["/"][DD].
    format: any
  - id: req:interval-abbreviated-end-day-omitted
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.5.1:tech:interval-abbreviated-end-day-omitted"
    statement: >
      In a start/end interval, the year, month, and day of the end expression
      may all be omitted when unambiguous; the end expression then contains
      only the time-of-day, e.g. [start]["T"][time]["/"]["T"][time].
    format: any
  - id: req:interval-abbreviation-ambiguity-rule
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.5.1:tech:interval-abbreviation-ambiguity-rule"
    statement: >
      Abbreviated end expressions shall be used only where the resulting
      interval remains unambiguous. The number of components in the end
      expression shall not exceed the number in the start expression, and
      each omitted component shall be unambiguously inheritable from the
      start.
    format: any
  - id: req:interval-time-shift-inheritance
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:5.5.1:tech:interval-time-shift-inheritance"
    statement: >
      A UTC offset provided with the component before the solidus is assumed to
      apply to the component after the solidus, unless the latter provides its
      own offset.
    format: any
