# yaml-language-server: $schema=../../schema/requirements-class.yaml
---
id: req-class:fundamentals
name: Fundamentals
description: >
  Fundamental principles for ISO 8601 date and time representations, including
  calendar rules, time scale components, and expansion rules. Character-set
  validity is implicit in every other conformance class — if a parser accepts
  a well-formed date, the characters are by definition valid — so it is not
  modelled as a separate requirement here.
standardization_target_type: iso-8601-date-time-processor
source:
  - urn:iso:std:iso:8601:-1:ed-1:en:clause:4
  - urn:iso:std:iso:8601:-1:ed-1:en:clause:5.1
requirements:
  - id: req:decreasing-order
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:4.1:tech:decreasing-order"
    statement: >
      The decreasing order of time scale components, left-to-right, is common to
      all date and time representations.
    format: any
  - id: req:gregorian-calendar
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:4.2.1:tech:gregorian-calendar"
    statement: >
      The Gregorian calendar governs the identification of calendar days. This
      calendar structures time as a continuous sequence of calendar years, with
      common years containing 365 days and leap years containing 366 days. Each
      calendar year comprises 12 consecutive calendar months.
    format: any
  - id: req:leap-year-rules
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:4.2.1:tech:leap-year-rules"
    statement: >
      A calendar year is a leap year if it is divisible by 4, except that years
      divisible by 100 are not leap years unless they are also divisible by 400.
      A leap year has 366 days with February having 29 days; a common year has
      365 days with February having 28 days.
    format: any
  - id: req:days-per-month
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:4.2.1:tech:days-per-month"
    statement: >
      Calendar months shall have the following number of days: January 31,
      February 28 (29 in leap years), March 31, April 30, May 31, June 30,
      July 31, August 31, September 30, October 31, November 30, December 31.
    format: any
  - id: req:week-calendar
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:4.2.2"
    statement: >
      The week calendar is based on an unbounded series of contiguous calendar
      weeks. Each calendar week has seven calendar days identified by ordinal
      number from 1 (Monday) through 7 (Sunday). The reference point assigns
      Saturday to 1 January 2000.
    format: any
  - id: req:24-hour-clock
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:4.2.3"
    statement: >
      Time of day is expressed using a 24-hour clock. A clock hour is identified
      by a two-digit ordinal number from '00' to '23'. A clock minute from '00'
      to '59'. A clock second from '00' to '59' under normal conditions.
    format: any
  - id: req:second-range-59-normal
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:4.2.3:tech:second-range-59-normal"
    statement: >
      Under normal conditions, a clock second is identified by a two-digit
      ordinal number from '00' through '59'.
    format: any
    pattern: "[ss]"
  - id: req:leap-second-positive
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:4.2.3:tech:leap-second-positive"
    statement: >
      A positive leap second is represented by the second value '60', inserted
      as the 61st second of the affected minute (UTC only).
    format: any
    pattern: "[hh][mm]60"
  - id: req:leap-second-negative
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:4.2.3:tech:leap-second-negative"
    statement: >
      A negative leap second is represented by the second value '58' (the
      last second of the affected minute being dropped). The second value '58'
      is the last value of that minute in place of '59'.
    format: any
    pattern: "[hh][mm]58"
  - id: req:proleptic-gregorian-mutual-agreement
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:4.2.1:tech:proleptic-gregorian-mutual-agreement"
    statement: >
      By mutual agreement of the communicating partners, the Gregorian calendar
      may be used proleptically, i.e. applied to dates preceding its
      introduction in 1582, by treating it as if it had been in continuous
      operation from year zero onwards.
    format: any
  - id: req:year-range-0000-9999
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:4.3.2:tech:year-range-0000-9999"
    statement: >
      Each Gregorian calendar year can be identified by a 4-digit ordinal
      number beginning with '0000' for year zero, through '9999'.
    format: any
    pattern: "[YYYY]"
  - id: req:year-minus-sign
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:4.3.2:tech:year-minus-sign"
    statement: >
      A year preceding year zero is indicated by prefixing the year number with
      a minus sign ['-'][YYYY]. Years at or after year zero carry no sign.
    format: any
    pattern: "[-][YYYY]"
  - id: req:month-representation
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:4.3.3"
    statement: >
      Each calendar month within its calendar year is identified by a two-digit
      ordinal number from '01' for January to '12' for December.
    format: any
    pattern: "[MM]"
  - id: req:week-number-representation
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:4.3.4"
    statement: >
      The calendar week of year is identified by a two-digit ordinal number from
      '01' for the first calendar week through '52' or '53', depending on the
      number of calendar weeks in that calendar year.
    format: any
    pattern: "[\"W\"][WW]"
  - id: req:day-of-week-representation
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:4.3.6"
    statement: >
      The calendar day of week is represented by a single digit ordinal number
      from '1' (Monday) through '7' (Sunday).
    format: any
    pattern: "[K]"
  - id: req:day-of-year-representation
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:4.3.7"
    statement: >
      The calendar day of year is represented by a three-digit ordinal number
      from '001' (January 1) through '365' (common year) or '366' (leap year).
    format: any
    pattern: "[OOO]"
  - id: req:decade-representation
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:4.3.11"
    statement: >
      Each Gregorian calendar decade is identified by a 3-digit ordinal number
      beginning with '000', for decade zero, through '999'. The decade is
      represented in implied form as [YYY].
    format: basic
    pattern: "[YYY]"
  - id: req:century-representation
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:4.3.12"
    statement: >
      Each Gregorian calendar century is identified by a 2-digit ordinal number
      beginning with '00', for century zero, through '99'. The century is
      represented in implied form as [YY].
    format: basic
    pattern: "[YY]"
  - id: req:time-shift-basic-hm
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:4.3.13:tech:time-shift-basic-hm"
    statement: >
      A time shift in basic format is encoded as a sign followed by hour and
      minute as contiguous fields: [±][hour][min].
    format: basic
    pattern: "[±][hh][mm]"
  - id: req:time-shift-basic-h
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:4.3.13:tech:time-shift-basic-h"
    statement: >
      A time shift in basic format may omit the minute component, encoding only
      the sign and hour: [±][hour].
    format: basic
    pattern: "[±][hh]"
  - id: req:time-shift-extended-hm
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:4.3.13:tech:time-shift-extended-hm"
    statement: >
      A time shift in extended format is encoded as a sign followed by hour and
      minute with a colon separator: [±][hour][":"][min].
    format: extended
    pattern: "[±][hh][\":\"][mm]"
  - id: req:time-shift-utc
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:4.3.13:tech:time-shift-utc"
    statement: >
      The UTC designator ["Z"] indicates that the associated time is the UTC
      time scale (no shift from UTC). It is appended directly after the time
      expression with no intervening space.
    format: any
    pattern: "[\"Z\"]"
  - id: req:time-shift-sign-mandatory
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:4.3.13:tech:time-shift-sign-mandatory"
    statement: >
      The sign of a time shift is mandatory. The shift shall be positive when
      the local time is ahead of or equal to UTC, and negative when behind UTC.
    format: any
  - id: req:expansion
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:4.4"
    statement: >
      By mutual agreement of the communicating partners, it is permitted to expand
      the component identifying the calendar year, which is otherwise limited to
      four digits. This enables reference to dates where the calendar year
      identifier exceeds four digits.
    format: any
  - id: req:leading-zeros
    clause: "urn:iso:std:iso:8601:-1:ed-1:en:clause:4.5"
    statement: >
      If a time scale component in an implied representation has a fixed length,
      leading zeros shall be used as required.
    format: any
