# yaml-language-server: $schema=../../schema/requirements-class.yaml
---
id: req-class:grouped-time-scale-units
name: Grouped time scale units
description: >
  Defines grouped time scale units as composite units of smaller time scale
  units, using the G-designator prefix and U-designator suffix. Grouped units
  replace any time scale unit component in date and time representations.
standardization_target_type: iso-8601-date-time-processor
dependencies:
  - 8601-1:req-class:fundamentals
source:
  - urn:iso:std:iso:8601:-2:ed-1:en:clause:5
requirements:
  - id: req:grouped-unit-definition
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:5.2"
    statement: >
      A grouped time scale unit is enclosed by the G prefix and U suffix, with
      one or more positive duration components in between:
      ["G"][durationUnits]["U"].
    format: any
    pattern: '["G"][durationUnits]["U"]'
  - id: req:grouped-unit-value
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:5.3"
    statement: >
      The value of a grouped unit combines a coefficient with the grouped unit
      definition: [i][groupUnit], where [i] selects the specific sub-unit.
    format: any
    pattern: "[i][groupUnit]"
  - id: req:grouped-application-no-lower-order
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:5.4.1:tech:grouped-application-no-lower-order"
    statement: >
      A grouped time scale unit may replace a time scale component in a date
      or time expression when no lower-order components follow, expressing
      precision exactly at the grouped unit boundary.
    format: any
  - id: req:grouped-application-with-lower-order
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:5.4.2:tech:grouped-application-with-lower-order"
    statement: >
      A grouped time scale unit may replace a higher-order component while
      retaining lower-order components that select instances within the
      grouped unit.
    format: any
  - id: req:grouped-application-order
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:5.4:tech:grouped-application-order"
    statement: >
      Components appearing to the right of a grouped time scale unit describe
      instances within that grouped unit.
    format: any
  - id: req:grouped-boundary-adherence-valid
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:5.4.3:tech:grouped-boundary-adherence-valid"
    statement: >
      A lower-order component value that falls within the bounds established
      by the grouped time scale unit definition is valid. For example, a
      day-of-week value of 1 through 7 is valid within a week-grouped unit.
    format: any
  - id: req:grouped-boundary-adherence-invalid
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:5.4.3:tech:grouped-boundary-adherence-invalid"
    statement: >
      A lower-order component value that exceeds the bounds established by
      the grouped time scale unit definition is invalid. For example, a
      day-of-week value of 8 within a week-grouped unit is rejected.
    format: any
  - id: req:grouped-representation-with-shift
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:5.4.4"
    statement: >
      An expression using grouped time scale units may include a time shift:
      [groupDateTime][shiftE].
    format: any
    pattern: "[groupDateTime][shiftE]"
  - id: req:grouped-conversion-to-interval
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:5.4.5"
    statement: >
      A grouped time scale unit expression can be converted into an equivalent
      time interval using basic time scale units.
    format: any
  - id: req:grouped-truncation-partial
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:5.4.5.2"
    statement: >
      When a grouped unit does not evenly divide the original component, the
      final unit spans only the remaining bounded duration.
    format: any
