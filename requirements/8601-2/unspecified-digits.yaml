# yaml-language-server: $schema=../../schema/requirements-class.yaml
---
id: req-class:unspecified-digits
name: Unspecified calendar date digits
description: >
  Applies the rules of unspecified digits to date and time expressions.
  The unspecified value character "X" indicates unspecified digits or values in time
  scale components. "X*" indicates the entire value is unspecified.
standardization_target_type: iso-8601-date-time-processor
dependencies:
  - 8601-1:req-class:calendar-date
source:
  - urn:iso:std:iso:8601:-2:ed-1:en:clause:9
requirements:
  - id: req:unspecified-explicit-forms-x-star
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:4.6.2:tech:unspecified-explicit-forms-x-star"
    statement: >
      In explicit forms, "X*" marks an entire time scale component value as
      unspecified.
    format: any
  - id: req:unspecified-explicit-forms-single-x
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:4.6.2:tech:unspecified-explicit-forms-single-x"
    statement: >
      In explicit forms, "X" replaces any single digit within a time scale
      component value to indicate that digit is unspecified.
    format: any
  - id: req:unspecified-implicit-forms
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:4.6.3"
    statement: >
      In implicit forms, "X" replaces individual digits to mark them as
      unspecified. Replacing all digits of a component indicates the entire
      component is unspecified.
    format: any
  - id: req:unspecified-right-day-implicit
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:9.2.1.1:tech:unspecified-right-day-implicit"
    statement: >
      A calendar date with unspecified day in implicit form:
      [year]["-"][month]["-"]["XX"].
    format: extended
    pattern: '[year]["-"][month]["-"]["XX"]'
  - id: req:unspecified-right-day-explicit
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:9.2.1.1:tech:unspecified-right-day-explicit"
    statement: >
      A calendar date with unspecified day in explicit form:
      [yearE][monthE]["X*D"].
    format: any
    pattern: '[yearE][monthE]["X*D"]'
  - id: req:unspecified-right-month-day-implicit
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:9.2.1.1:tech:unspecified-right-month-day-implicit"
    statement: >
      A calendar date with unspecified month and day in implicit form:
      [year]["-"]["XX"]["-"]["XX"].
    format: extended
    pattern: '[year]["-"]["XX"]["-"]["XX"]'
  - id: req:unspecified-right-month-day-explicit
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:9.2.1.1:tech:unspecified-right-month-day-explicit"
    statement: >
      A calendar date with unspecified month and day in explicit form:
      [yearE]["X*M"]["X*D"].
    format: any
    pattern: '[yearE]["X*M"]["X*D"]'
  - id: req:unspecified-right-all-implicit
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:9.2.1.1:tech:unspecified-right-all-implicit"
    statement: >
      A calendar date with all components unspecified in implicit form:
      ["XXXX"]["-"]["XX"]["-"]["XX"].
    format: extended
    pattern: '["XXXX"]["-"]["XX"]["-"]["XX"]'
  - id: req:unspecified-right-all-explicit
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:9.2.1.1:tech:unspecified-right-all-explicit"
    statement: >
      A calendar date with all components unspecified in explicit form:
      ["X*Y"]["X*M"]["X*D"].
    format: any
    pattern: '["X*Y"]["X*M"]["X*D"]'
  - id: req:unspecified-reduced-month-implicit
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:9.2.1.2:tech:unspecified-reduced-month-implicit"
    statement: >
      Reduced precision with unspecified calendar month in implicit form:
      [year]["-"]["XX"].
    format: extended
    pattern: '[year]["-"]["XX"]'
  - id: req:unspecified-reduced-month-explicit
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:9.2.1.2:tech:unspecified-reduced-month-explicit"
    statement: >
      Reduced precision with unspecified calendar month in explicit form:
      [yearE]["X*M"].
    format: any
    pattern: '[yearE]["X*M"]'
  - id: req:unspecified-reduced-year-digits
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:9.2.1.2:tech:unspecified-reduced-year-digits"
    statement: >
      One to four rightmost digits of the calendar year may be replaced with "X"
      to indicate those digits are unspecified.
    format: any
  - id: req:unspecified-year-omitted
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:9.2.6"
    statement: >
      A calendar date with the calendar year entirely or partially unspecified,
      with one or more "X" digits appearing at any position within the year
      component while the remaining date components are specified.
    format: any
  - id: req:unspecified-month-omitted
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:9.2.7"
    statement: >
      A calendar date with the calendar month entirely or partially unspecified,
      with one or more "X" digits appearing at any position within the month
      component while year and day remain specified.
    format: any
  - id: req:unspecified-day-omitted
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:9.2.8"
    statement: >
      A calendar date with the day of month entirely or partially unspecified,
      with one or more "X" digits appearing at any position within the day
      component while year and month remain specified.
    format: any
  - id: req:unspecified-combination
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:9.2.9"
    statement: >
      A calendar date with two or more time scale components simultaneously
      carrying unspecified digits ("X"), combining year, month, and day
      omissions in a single expression.
    format: any
  - id: req:unspecified-time-omitted
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:9.2.10"
    statement: >
      A date and time expression with one or more time-of-day components
      (hour, minute, second) entirely or partially unspecified via "X" digits,
      while the date portion remains fully or partially specified.
    format: any
  - id: req:unspecified-datetime-expression
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:9.3"
    statement: >
      The unspecified digit rules extend to any date and time expression,
      including time-of-day components.
    format: any
