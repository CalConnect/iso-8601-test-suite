# yaml-language-server: $schema=../../schema/requirements-class.yaml
---
id: req-class:extended-time-intervals
name: Extended time interval representations
description: >
  Extends time interval representations to allow unknown or open start or end
  dates, qualification of dates in time intervals, and unspecified portions of
  dates in time intervals.
standardization_target_type: iso-8601-date-time-processor
dependencies:
  - 8601-1:req-class:time-interval
source:
  - urn:iso:std:iso:8601:-2:ed-1:en:clause:10
requirements:
  - id: req:extended-interval-open-end-implicit
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:10.2.1:tech:open-end-implicit"
    statement: >
      A time interval with an open (continuing) end may use an implicit-form
      start expression: a basic or extended date/time followed by a solidus
      and double-dot, e.g. [intexpr-implicit]["/"][".."].
    format: any
    pattern: '[intexpr-implicit]["/"][".."]'
  - id: req:extended-interval-open-end-explicit
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:10.2.1:tech:open-end-explicit"
    statement: >
      A time interval with an open (continuing) end may use an explicit-form
      start expression: a Part 2 explicit date/time (with Y/M/D designators)
      followed by a solidus and double-dot, e.g.
      [intexpr-explicit]["/"][".."].
    format: any
    pattern: '[intexpr-explicit]["/"][".."]'
  - id: req:extended-interval-open-start-implicit
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:10.2.2:tech:open-start-implicit"
    statement: >
      A time interval with an open (unbounded earlier) start may use an
      implicit-form end expression: a double-dot, solidus, and basic or
      extended date/time, e.g. [".."]["/"][intexpr-implicit].
    format: any
    pattern: '[".."]["/"][intexpr-implicit]'
  - id: req:extended-interval-open-start-explicit
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:10.2.2:tech:open-start-explicit"
    statement: >
      A time interval with an open (unbounded earlier) start may use an
      explicit-form end expression: a double-dot, solidus, and a Part 2
      explicit date/time (with Y/M/D designators), e.g.
      [".."]["/"][intexpr-explicit].
    format: any
    pattern: '[".."]["/"][intexpr-explicit]'
  - id: req:extended-interval-unknown-end-implicit
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:10.2.3:tech:unknown-end-implicit"
    statement: >
      A time interval with an unknown end may use an implicit-form start
      expression followed by a trailing solidus, e.g.
      [intexpr-implicit]["/"].
    format: any
    pattern: '[intexpr-implicit]["/"]'
  - id: req:extended-interval-unknown-end-explicit
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:10.2.3:tech:unknown-end-explicit"
    statement: >
      A time interval with an unknown end may use an explicit-form start
      expression followed by a trailing solidus, e.g.
      [intexpr-explicit]["/"].
    format: any
    pattern: '[intexpr-explicit]["/"]'
  - id: req:extended-interval-unknown-start-implicit
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:10.2.4:tech:unknown-start-implicit"
    statement: >
      A time interval with an unknown start may use an implicit-form end
      expression preceded by a leading solidus, e.g.
      ["/"][intexpr-implicit].
    format: any
    pattern: '["/"][intexpr-implicit]'
  - id: req:extended-interval-unknown-start-explicit
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:10.2.4:tech:unknown-start-explicit"
    statement: >
      A time interval with an unknown start may use an explicit-form end
      expression preceded by a leading solidus, e.g.
      ["/"][intexpr-explicit].
    format: any
    pattern: '["/"][intexpr-explicit]'
  - id: req:extended-interval-qualification-complete
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:10.3.2"
    statement: >
      Start and end dates within a time interval may carry uncertainty and
      approximation qualification symbols.
    format: any
  - id: req:extended-interval-qualification-partial
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:10.3.3"
    statement: >
      Individual portions of the start and/or end dates in a time interval may
      be independently qualified.
    format: any
  - id: req:extended-interval-unspecified
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:10.4"
    statement: >
      Portions of the start or end date in a time interval may use the "X"
      unspecified-digit notation.
    format: any
  - id: req:extended-interval-qualified-open
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:10.5"
    statement: >
      Start and end dates may combine uncertainty/approximation qualification,
      unspecified digits, and open or unknown boundary notations within a single
      time interval.
    format: any
  - id: req:extended-interval-before-after
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:10.6"
    statement: >
      "Before" and "after" boundaries with qualified time scale components use
      double-dot notation within time interval expressions.
    format: any
