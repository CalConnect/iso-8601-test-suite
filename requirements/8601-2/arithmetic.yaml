# yaml-language-server: $schema=../../schema/requirements-class.yaml
---
id: req-class:arithmetic
name: Date and time arithmetic
description: >
  Defines arithmetic operations on date and time expressions including
  addition, subtraction, and multiplication of durations, date modification
  by duration, overflow/underflow resolution, and canonical form derivation.
standardization_target_type: iso-8601-date-time-processor
dependencies:
  - 8601-1:req-class:date-and-time
  - 8601-1:req-class:duration
source:
  - urn:iso:std:iso:8601:-2:ed-1:en:clause:14
requirements:
  - id: req:arithmetic-addition-duration
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:14.2:tech:arithmetic-addition-duration"
    statement: >
      Adding two durations produces a new duration whose time scale components
      are the arithmetic sums of the corresponding input components.
    format: any
  - id: req:arithmetic-subtraction-duration
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:14.2:tech:arithmetic-subtraction-duration"
    statement: >
      Subtracting a duration is equivalent to adding the negation of that
      duration.
    format: any
  - id: req:arithmetic-composite-addition
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:14.2:tech:arithmetic-composite-addition"
    statement: >
      In composite duration arithmetic, adding two durations yields a new
      duration with component-wise sums of the corresponding fields.
    format: any
  - id: req:arithmetic-precedence-addition
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:14.2:tech:arithmetic-precedence-addition"
    statement: >
      In precedence duration arithmetic, adding two durations concatenates the
      durational units without computing component-level sums.
    format: any
  - id: req:arithmetic-multiplication
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:14.3"
    statement: >
      A duration may be scaled by a scalar multiplier, producing a new duration.
    format: any
  - id: req:arithmetic-date-duration
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:14.4:tech:arithmetic-date-duration"
    statement: >
      A date and time expression may be shifted by a duration through addition:
      date = dateA + durationB.
    format: any
  - id: req:arithmetic-date-precedence
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:14.4:tech:arithmetic-date-precedence"
    statement: >
      When the duration is in precedence representation, evaluation proceeds
      from the leftmost durational unit to the rightmost.
    format: any
  - id: req:arithmetic-overflow-underflow
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:14.5"
    statement: >
      Component values exceeding their valid range indicate overflow (positive
      excess) or underflow (negative excess).
    format: any
  - id: req:arithmetic-conversion-century-decade
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:14.6:tech:arithmetic-conversion-century-decade"
    statement: >
      Century and decade components convert unambiguously: 1 century equals
      10 decades. Conversion in either direction yields a fixed result.
    format: any
  - id: req:arithmetic-conversion-decade-year
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:14.6:tech:arithmetic-conversion-decade-year"
    statement: >
      Decade and year components convert unambiguously: 1 decade equals 10
      years. Conversion in either direction yields a fixed result.
    format: any
  - id: req:arithmetic-conversion-year-month
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:14.6:tech:arithmetic-conversion-year-month"
    statement: >
      Year and month components convert unambiguously: 1 year equals 12
      months. Conversion in either direction yields a fixed result.
    format: any
  - id: req:arithmetic-conversion-week-day
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:14.6:tech:arithmetic-conversion-week-day"
    statement: >
      Week and day components convert unambiguously: 1 week equals 7 days.
      Conversion in either direction yields a fixed result.
    format: any
  - id: req:arithmetic-conversion-day-hour
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:14.6:tech:arithmetic-conversion-day-hour"
    statement: >
      Day and hour components convert unambiguously: 1 day equals 24 hours.
      Conversion in either direction yields a fixed result.
    format: any
  - id: req:arithmetic-conversion-hour-minute
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:14.6:tech:arithmetic-conversion-hour-minute"
    statement: >
      Hour and minute components convert unambiguously: 1 hour equals 60
      minutes. Conversion in either direction yields a fixed result.
    format: any
  - id: req:arithmetic-conversion-minute-second
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:14.6:tech:arithmetic-conversion-minute-second"
    statement: >
      Minute and second components convert unambiguously: 1 minute equals
      60 seconds (ignoring leap seconds). Conversion in either direction
      yields a fixed result.
    format: any
  - id: req:arithmetic-conversion-year-week-ambiguous
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:14.6:tech:arithmetic-conversion-year-week-ambiguous"
    statement: >
      Year and week components do not convert unambiguously because a year
      may contain 52 or 53 weeks depending on the year. Conversion between
      them requires a context date.
    format: any
  - id: req:arithmetic-conversion-year-day-ambiguous
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:14.6:tech:arithmetic-conversion-year-day-ambiguous"
    statement: >
      Year and day components do not convert unambiguously because a year
      may contain 365 or 366 days depending on whether it is a leap year.
      Conversion between them requires a context date.
    format: any
  - id: req:arithmetic-conversion-month-day-ambiguous
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:14.6:tech:arithmetic-conversion-month-day-ambiguous"
    statement: >
      Month and day components do not convert unambiguously because a month
      may contain 28, 29, 30, or 31 days depending on the month and year.
      Conversion between them requires a context date.
    format: any
  - id: req:arithmetic-canonical-form-concrete-context
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:14.7:tech:arithmetic-canonical-form-concrete-context"
    statement: >
      When the context is concrete (a specific calendar date is known), a
      date and time expression can be reduced to a canonical form with no
      overflow and minimal underflow by carrying excess into higher-order
      components.
    format: any
  - id: req:arithmetic-canonical-form-context-dependent
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:14.7:tech:arithmetic-canonical-form-context-dependent"
    statement: >
      When the context lacks a specific calendar date (e.g. only a year is
      known), canonical-form reduction cannot fully resolve ambiguous
      conversions and the result retains the original unit structure.
    format: any
  - id: req:arithmetic-canonical-form-algorithm
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:14.7:tech:arithmetic-canonical-form-algorithm"
    statement: >
      The canonical-form algorithm proceeds component-wise from lowest to
      highest order, carrying excess into the next higher component when
      conversion is unambiguous, as specified in Annex D.
    format: any
