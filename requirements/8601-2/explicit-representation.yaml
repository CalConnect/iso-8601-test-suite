# yaml-language-server: $schema=../../schema/requirements-class.yaml
---
id: req-class:explicit-representation
name: Explicit representation for date and time
description: >
  Defines explicit forms for date and time representations using designated
  symbols (Y, M, D, H, M, S, etc.) for each time scale component. These
  representations extend ISO 8601-1 to allow explicit form usage beyond duration.
standardization_target_type: iso-8601-date-time-processor
dependencies:
  - 8601-1:req-class:fundamentals
source:
  - urn:iso:std:iso:8601:-2:ed-1:en:clause:7
requirements:
  - id: req:explicit-calendar-date
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.2.2"
    statement: >
      A calendar date in explicit form encodes the year, month, and day with their
      respective designator symbols: [yearE][monthE][dayE].
    format: any
    pattern: "[yearE][monthE][dayE]"
  - id: req:explicit-ordinal-date
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.2.3"
    statement: >
      An ordinal date in explicit form encodes the year and day-of-year with their
      respective designator symbols: [yearE][dayoE].
    format: any
    pattern: "[yearE][dayoE]"
  - id: req:explicit-week-date
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.2.4"
    statement: >
      A week date in explicit form encodes the year, week number, and day of week
      with their respective designator symbols: [yearE][weekE][daykE].
    format: any
    pattern: "[yearE][weekE][daykE]"
  - id: req:explicit-local-time
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.3.1:tech:explicit-local-time"
    statement: >
      Local time of day in explicit form encodes the time designator followed by
      hour, minute, and second with designator symbols: ["T"][hourE][minE][secE],
      denoted as [timeE].
    format: any
    pattern: '["T"][hourE][minE][secE]'
  - id: req:explicit-time-reduced-hour
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.3.1:tech:explicit-time-reduced-hour"
    statement: >
      The explicit time form supports reduced precision to the hour only,
      encoding ["T"][hourE] with minute and second omitted.
    format: any
    pattern: '["T"][hourE]'
  - id: req:explicit-time-reduced-minute
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.3.1:tech:explicit-time-reduced-minute"
    statement: >
      The explicit time form supports reduced precision to the minute,
      encoding ["T"][hourE][minE] with the second omitted.
    format: any
    pattern: '["T"][hourE][minE]'
  - id: req:explicit-bod-full
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.3.2:tech:explicit-bod-full"
    statement: >
      The beginning of the day in explicit form is encoded as ["T"]["0H"]["0M"]["0S"],
      representing the first instant where no time has elapsed.
    format: any
    pattern: '["T"]["0H"]["0M"]["0S"]'
  - id: req:explicit-bod-omitted-zeros
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.3.2:tech:explicit-bod-omitted-zeros"
    statement: >
      The beginning of the day in explicit form may be encoded with zero-valued
      higher-order components omitted per the omission rules, leaving
      ["T"]["0S"].
    format: any
    pattern: '["T"]["0S"]'
  - id: req:explicit-time-shift-utc
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.4:tech:explicit-time-shift-utc"
    statement: >
      A time shift in explicit form may be represented as the UTC designator
      ["Z"], denoting a zero shift relative to UTC.
    format: any
    pattern: '["Z"]'
  - id: req:explicit-time-shift-offset
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.4:tech:explicit-time-shift-offset"
    statement: >
      A time shift in explicit form may be represented as a numeric offset
      preceded by a sign: ["+"|"-"][timeUnits], where timeUnits are explicit
      hour/minute components.
    format: any
    pattern: '["+"|"-"][timeUnits]'
  - id: req:explicit-time-shift-positive
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.4:tech:explicit-time-shift-positive"
    statement: >
      A positive time shift in explicit form (local time ahead of UTC) uses
      the ["+"] sign: ["+"][timeUnits].
    format: any
    pattern: '["+"][timeUnits]'
  - id: req:explicit-time-shift-reduced-precision
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.4:tech:explicit-time-shift-reduced-precision"
    statement: >
      The explicit time shift supports reduced precision by omitting the
      minutes component when its value is zero, leaving only the hour.
    format: any
    pattern: '["+"|"-"][hourE]'
  - id: req:explicit-date-with-shift
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.5"
    statement: >
      A date with a time shift in explicit form combines the date and shift:
      [dateE][shiftE].
    format: any
    pattern: "[dateE][shiftE]"
  - id: req:explicit-time-with-shift
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.6"
    statement: >
      A time of day with a time shift in explicit form combines the time and shift:
      [timeE][shiftE].
    format: any
    pattern: "[timeE][shiftE]"
  - id: req:explicit-datetime
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.7.2"
    statement: >
      A date and time in explicit form combines the date and time expressions:
      [dateE][timeE], denoted as [datetimeE].
    format: any
    pattern: "[dateE][timeE]"
  - id: req:explicit-datetime-with-shift
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.7.3"
    statement: >
      A date and time with a time shift in explicit form combines date, time,
      and shift: [dateE][timeE][shiftE].
    format: any
    pattern: "[dateE][timeE][shiftE]"
  - id: req:explicit-decade
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.8"
    statement: >
      A decade in explicit form encodes the decade value with its designator
      symbol: [decE].
    format: any
    pattern: "[decE]"
  - id: req:explicit-century
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.9"
    statement: >
      A century in explicit form encodes the century value with its designator
      symbol: [centE].
    format: any
    pattern: "[centE]"
  - id: req:explicit-omission-zero-component
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.10:tech:explicit-omission-zero-component"
    statement: >
      A time scale component whose value is zero may be omitted along with its
      designator in an explicit form expression.
    format: any
  - id: req:explicit-omission-zero-precision-preservation
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.10:tech:explicit-omission-zero-precision-preservation"
    statement: >
      A zero-valued component shall not be omitted when doing so would alter
      the precision indication of the expression. When precision is conveyed
      by the presence of the component, it must be retained as ["0"] with
      its designator.
    format: any
  - id: req:explicit-precision
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.11"
    statement: >
      The lowest-order time scale component present in an explicit date-time
      expression determines the precision of that expression.
    format: any
  - id: req:explicit-fraction-hour
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.12:tech:explicit-fraction-hour"
    statement: >
      An explicit form expression may include a decimal fraction on the hour
      component, separated by a decimal sign (period or comma) with at least
      one fractional digit. When the hour carries a fraction, minute and
      second are omitted.
    format: any
    pattern: '[hourE][decimal][f]'
  - id: req:explicit-fraction-minute
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.12:tech:explicit-fraction-minute"
    statement: >
      An explicit form expression may include a decimal fraction on the
      minute component, separated by a decimal sign (period or comma) with
      at least one fractional digit. When the minute carries a fraction,
      the second is omitted.
    format: any
    pattern: '[minE][decimal][f]'
  - id: req:explicit-fraction-second
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.12:tech:explicit-fraction-second"
    statement: >
      An explicit form expression may include a decimal fraction on the
      second component, separated by a decimal sign (period or comma) with
      at least one fractional digit. The second is the lowest-order time
      component and admits a fraction without affecting higher components.
    format: any
    pattern: '[secE][decimal][f]'
  - id: req:explicit-time-interval-start-end
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.14.1:tech:explicit-time-interval-start-end"
    statement: >
      A time interval in explicit form with start and end date:
      [dtE]["/"][dtE].
    format: any
    pattern: '[dtE]["/"][dtE]'
  - id: req:explicit-time-interval-start-duration
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.14.1:tech:explicit-time-interval-start-duration"
    statement: >
      A time interval in explicit form with start and duration:
      [dtE]["/"][duration].
    format: any
    pattern: '[dtE]["/"][duration]'
  - id: req:explicit-time-interval-end-duration
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.14.1:tech:explicit-time-interval-end-duration"
    statement: >
      A time interval in explicit form with duration and end:
      [duration]["/"][dtE].
    format: any
    pattern: '[duration]["/"][dtE]'
  - id: req:explicit-time-interval-component-order
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.14.2"
    statement: >
      Higher-order time scale components may be omitted from the end of an explicit
      time interval, provided the expression remains unambiguous.
    format: any
  - id: req:explicit-time-interval-shift
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.14.3"
    statement: >
      A time shift specified in the start component of an explicit interval is
      assumed to apply to the end component, unless the end provides its own shift.
    format: any
  - id: req:explicit-recurring-time-interval
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.15"
    statement: >
      A recurring time interval in explicit form prefixes the interval with the
      recurrence designator: ["R"][n]["/"][timeIntervalE].
    format: any
    pattern: '["R"][n]["/"][timeIntervalE]'
