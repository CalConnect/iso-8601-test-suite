# yaml-language-server: $schema=../../schema/requirements-class.yaml
---
id: req-class:explicit-representation
name: Explicit representation for date and time
description: >
  Defines explicit forms for date and time representations using designated
  symbols (Y, M, D, H, M, S, etc.) for each time scale component. These
  representations extend ISO 8601-1 to allow explicit form usage beyond duration.
standardization_target_type: iso-8601-date-time-processor
dependencies:
  - 8601-1:req-class:fundamentals
source:
  - urn:iso:std:iso:8601:-2:ed-1:en:clause:7
requirements:
  - id: req:explicit-calendar-date
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.2.2"
    statement: >
      A calendar date in explicit form encodes the year, month, and day with their
      respective designator symbols: [yearE][monthE][dayE].
    format: any
    pattern: "[yearE][monthE][dayE]"
  - id: req:explicit-ordinal-date
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.2.3"
    statement: >
      An ordinal date in explicit form encodes the year and day-of-year with their
      respective designator symbols: [yearE][dayoE].
    format: any
    pattern: "[yearE][dayoE]"
  - id: req:explicit-week-date
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.2.4"
    statement: >
      A week date in explicit form encodes the year, week number, and day of week
      with their respective designator symbols: [yearE][weekE][daykE].
    format: any
    pattern: "[yearE][weekE][daykE]"
  - id: req:explicit-local-time
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.3.1:tech:explicit-local-time"
    statement: >
      Local time of day in explicit form encodes the time designator followed by
      hour, minute, and second with designator symbols: ["T"][hourE][minE][secE],
      denoted as [timeE].
    format: any
    pattern: '["T"][hourE][minE][secE]'
  - id: req:explicit-time-reduced-precision
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.3.1:tech:explicit-time-reduced-precision"
    statement: >
      The explicit time form [timeE] supports reduced precision by including only
      [hourE] or [hourE] and [minE], with trailing components omitted.
    format: any
    pattern: '["T"][hourE][!][minE][!][secE]'
  - id: req:explicit-beginning-of-day
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.3.2"
    statement: >
      The beginning of the day in explicit form is encoded as T0H0M0S.
      Zero-valued components may be omitted per the omission rules.
    format: any
    pattern: '["T"]["0H"]["0M"]["0S"]'
  - id: req:explicit-time-shift
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.4"
    statement: >
      A time shift in explicit form is represented as ["Z"] or
      ["-"][timeUnits], denoted as [shiftE].
    format: any
    pattern: '["Z"][!]["-"][timeUnits]'
  - id: req:explicit-date-with-shift
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.5"
    statement: >
      A date with a time shift in explicit form combines the date and shift:
      [dateE][shiftE].
    format: any
    pattern: "[dateE][shiftE]"
  - id: req:explicit-time-with-shift
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.6"
    statement: >
      A time of day with a time shift in explicit form combines the time and shift:
      [timeE][shiftE].
    format: any
    pattern: "[timeE][shiftE]"
  - id: req:explicit-datetime
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.7.2"
    statement: >
      A date and time in explicit form combines the date and time expressions:
      [dateE][timeE], denoted as [datetimeE].
    format: any
    pattern: "[dateE][timeE]"
  - id: req:explicit-datetime-with-shift
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.7.3"
    statement: >
      A date and time with a time shift in explicit form combines date, time,
      and shift: [dateE][timeE][shiftE].
    format: any
    pattern: "[dateE][timeE][shiftE]"
  - id: req:explicit-decade
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.8"
    statement: >
      A decade in explicit form encodes the decade value with its designator
      symbol: [decE].
    format: any
    pattern: "[decE]"
  - id: req:explicit-century
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.9"
    statement: >
      A century in explicit form encodes the century value with its designator
      symbol: [centE].
    format: any
    pattern: "[centE]"
  - id: req:explicit-omission-zero
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.10"
    statement: >
      A time scale component whose value is zero may be omitted along with its
      designator, except when omission would alter the precision indication.
    format: any
  - id: req:explicit-precision
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.11"
    statement: >
      The lowest-order time scale component present in an explicit date-time
      expression determines the precision of that expression.
    format: any
  - id: req:explicit-decimal-fractions
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.12"
    statement: >
      Explicit form expressions may include a decimal fraction on the hour, minute,
      or second component.
    format: any
  - id: req:explicit-time-interval-start-end
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.14.1:tech:explicit-time-interval-start-end"
    statement: >
      A time interval in explicit form with start and end date:
      [dtE]["/"][dtE].
    format: any
    pattern: '[dtE]["/"][dtE]'
  - id: req:explicit-time-interval-start-duration
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.14.1:tech:explicit-time-interval-start-duration"
    statement: >
      A time interval in explicit form with start and duration:
      [dtE]["/"][duration].
    format: any
    pattern: '[dtE]["/"][duration]'
  - id: req:explicit-time-interval-end-duration
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.14.1:tech:explicit-time-interval-end-duration"
    statement: >
      A time interval in explicit form with duration and end:
      [duration]["/"][dtE].
    format: any
    pattern: '[duration]["/"][dtE]'
  - id: req:explicit-time-interval-component-order
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.14.2"
    statement: >
      Higher-order time scale components may be omitted from the end of an explicit
      time interval, provided the expression remains unambiguous.
    format: any
  - id: req:explicit-time-interval-shift
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.14.3"
    statement: >
      A time shift specified in the start component of an explicit interval is
      assumed to apply to the end component, unless the end provides its own shift.
    format: any
  - id: req:explicit-recurring-time-interval
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:7.15"
    statement: >
      A recurring time interval in explicit form prefixes the interval with the
      recurrence designator: ["R"][n]["/"][timeIntervalE].
    format: any
    pattern: '["R"][n]["/"][timeIntervalE]'
  - id: req:explicit-additional-forms-day-of-week
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:4.3.3"
    statement: >
      The calendar day of week in explicit form encodes the value with the K
      designator: [i]["K"].
    format: any
    pattern: '[i]["K"]'
  - id: req:explicit-additional-forms-day-of-year
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:4.3.4"
    statement: >
      The calendar day of year in explicit form encodes the value with the O
      designator: [i]["O"].
    format: any
    pattern: '[i]["O"]'
  - id: req:explicit-additional-forms-decade
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:4.3.5"
    statement: >
      The decade in explicit form encodes the value with the J designator:
      [i]["J"].
    format: any
    pattern: '[i]["J"]'
  - id: req:explicit-additional-forms-century
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:4.3.6"
    statement: >
      The century in explicit form encodes the value with the C designator:
      [i]["C"].
    format: any
    pattern: '[i]["C"]'
  - id: req:explicit-value-prefixing
    clause: "urn:iso:std:iso:8601:-2:ed-1:en:clause:4.3.2"
    statement: >
      Leading zeros may be prepended to values in explicit form time scale
      components.
    format: any
