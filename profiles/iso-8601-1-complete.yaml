# yaml-language-server: $schema=../schema/profile.yaml
---
id: profile:iso-8601-1-complete
name: ISO 8601-1 Complete
description: >-
  Profile covering all conformance classes defined in ISO 8601-1 (Date and time
  — Representations for information interchange — Part 1: Basic rules).
source:
  - urn:iso:std:iso:8601:-1:ed-1:en
standardization_target_type: iso-8601-date-time-processor
traceability:
  - conformance_class: 8601-1:conf-class:fundamentals
    requirements:
      - req:decreasing-order
      - req:gregorian-calendar
      - req:leap-year-rules
      - req:days-per-month
      - req:week-calendar
      - req:24-hour-clock
      - req:second-range-59-normal
      - req:leap-second-positive
      - req:leap-second-negative
      - req:proleptic-gregorian-mutual-agreement
      - req:year-range-0000-9999
      - req:year-minus-sign
      - req:month-representation
      - req:week-number-representation
      - req:day-of-week-representation
      - req:day-of-year-representation
      - req:decade-representation
      - req:century-representation
      - req:time-shift-basic-hm
      - req:time-shift-basic-h
      - req:time-shift-extended-hm
      - req:time-shift-utc
      - req:time-shift-sign-mandatory
      - req:expansion
      - req:leading-zeros
  - conformance_class: 8601-1:conf-class:calendar-date
    requirements:
      - req:cal-date-basic-full
      - req:cal-date-extended-full
      - req:cal-date-reduced-month-ext
      - req:cal-date-reduced-year
      - req:cal-date-reduced-decade
      - req:cal-date-reduced-century
      - req:cal-date-expanded-basic-full
      - req:cal-date-expanded-extended-full
      - req:cal-date-expanded-extended-month
      - req:cal-date-expanded-basic-year
      - req:cal-date-expanded-basic-decade
      - req:cal-date-expanded-basic-century
  - conformance_class: 8601-1:conf-class:ordinal-date
    requirements:
      - req:ord-date-basic-full
      - req:ord-date-extended-full
      - req:ord-date-expanded-basic
      - req:ord-date-expanded-extended
  - conformance_class: 8601-1:conf-class:week-date
    requirements:
      - req:week-date-basic-full
      - req:week-date-extended-full
      - req:week-date-basic-week-only
      - req:week-date-extended-week-only
      - req:week-date-expanded-basic-full
      - req:week-date-expanded-extended-full
      - req:week-date-expanded-basic-week-only
      - req:week-date-expanded-extended-week-only
