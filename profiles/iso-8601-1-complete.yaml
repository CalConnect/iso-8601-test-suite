    requirements:
      - req:time-basic-full
      - req:time-extended-full
      - req:time-basic-hm
      - req:time-extended-hm
      - req:time-basic-h
      - req:time-fraction-second
      - req:time-fraction-second-comma
      - req:time-fraction-minute
      - req:time-fraction-minute-comma
      - req:time-fraction-hour
      - req:time-fraction-hour-comma
