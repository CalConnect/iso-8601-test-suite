      - req:time-bod-extended-full
      - req:time-bod-basic-hm
      - req:time-bod-extended-hm
      - req:time-bod-basic-h
      - req:time-bod-extended-h
      - req:time-eod-basic-full
      - req:time-eod-extended-full
      - req:time-eod-basic-hm
      - req:time-eod-extended-hm
      - req:time-eod-basic-h
      - req:time-eod-extended-h
      - req:time-24-only-valid-eod
