# yaml-language-server: $schema=../schema/profile.yaml
---
id: profile:rfc-3339
name: RFC 3339
description: >-
  Profile of ISO 8601-1 for Internet date/time formats as defined in
  RFC 3339. This profile restricts ISO 8601 to extended format only,
  requires full date (YYYY-MM-DD), mandates seconds in time representations,
  requires UTC offset, disallows hour 24, permits lowercase t/z, and
  accommodates leap seconds (second value 60).
source:
  - https://www.rfc-editor.org/rfc/rfc3339
standardization_target_type: iso-8601-date-time-processor
traceability:
  - conformance_class: 8601-1:conf-class:calendar-date
    requirements:
      - req:cal-date-extended-full
  - conformance_class: 8601-1:conf-class:time-of-day
    requirements:
      - req:time-extended-full
      - req:time-fraction-second
      - req:time-bod-extended-full
      - req:time-eod-extended-full
      - req:time-utc-extended-full
      - req:time-offset-extended-hm
  - conformance_class: 8601-1:conf-class:date-and-time
    requirements:
      - req:date-time-cal-extended-utc
      - req:date-time-cal-extended-offset
additional_requirements:
  - id: req:rfc-3339-extended-format-only
    statement: >-
      Only extended format representations shall be used. Basic format
      representations (without hyphens or colons as delimiters) are not
      permitted.
  - id: req:rfc-3339-time-designator
    statement: >-
      The time designator between the date and time components shall be
      "T" or "t". Applications that generate this format SHOULD use
      uppercase "T". Parsers SHALL accept both uppercase "T" and
      lowercase "t".
  - id: req:rfc-3339-utc-offset-required
    statement: >-
      Every date-time representation shall include either the UTC
      designator "Z" (or "z") or a numeric UTC offset (±hh:mm).
      Representations without a UTC offset are not permitted.
  - id: req:rfc-3339-no-hour-24
    statement: >-
      The hour value 24 is not allowed. Midnight shall be represented
      as 00:00:00 of the following day.
  - id: req:rfc-3339-full-date-required
    statement: >-
      Date representations shall be complete calendar dates
      (YYYY-MM-DD) only. Reduced precision forms (YYYY or YYYY-MM) are
      not permitted as standalone values.
  - id: req:rfc-3339-seconds-required
    statement: >-
      Time representations shall include seconds (hh:mm:ss). Fractional
      seconds (hh:mm:ss.s) are optional but the integer seconds field
      is mandatory. Representations with only hours and minutes
      (hh:mm) are not permitted.
  - id: req:rfc-3339-offset-minutes-required
    statement: >-
      Numeric UTC offsets shall include both hours and minutes
      (±hh:mm). Offset representations without minutes (±hh) are not
      permitted.
  - id: req:rfc-3339-leap-second
    statement: >-
      The second value 60 is permitted to represent a positive leap
      second. When a leap second occurs, the second field may contain
      the value "60" in place of the normal maximum of "59".
  - id: req:rfc-3339-unknown-local-offset
    statement: >-
      The UTC offset "-00:00" indicates that the date-time is in UTC
      but the local time zone relationship is unknown. This differs
      from "+00:00" which indicates UTC with a known zero offset.
      Both "-00:00" and "+00:00" are valid representations.
  - id: req:rfc-3339-lowercase-z
    statement: >-
      The UTC designator "Z" may alternatively be lowercase "z".
      Applications that generate this format SHOULD use uppercase "Z".
      Parsers SHALL accept both uppercase "Z" and lowercase "z".
additional_tests:
  - id: conf-test:rfc-3339-valid-001
    description: "Valid date-time with fractional seconds and UTC Z"
    requirements:
      - req:rfc-3339-extended-format-only
      - req:rfc-3339-time-designator
      - req:rfc-3339-utc-offset-required
    test_type: validity
    given:
      expression: "1985-04-12T23:20:50.52Z"
    expect:
      valid: true
  - id: conf-test:rfc-3339-valid-002
    description: "Valid date-time with positive UTC offset"
    requirements:
      - req:rfc-3339-extended-format-only
      - req:rfc-3339-time-designator
      - req:rfc-3339-utc-offset-required
      - req:rfc-3339-offset-minutes-required
    test_type: validity
    given:
      expression: "1985-04-12T23:20:50+02:00"
    expect:
      valid: true
  - id: conf-test:rfc-3339-valid-003
    description: "Valid date-time with negative UTC offset"
    requirements:
      - req:rfc-3339-extended-format-only
      - req:rfc-3339-time-designator
      - req:rfc-3339-utc-offset-required
      - req:rfc-3339-offset-minutes-required
    test_type: validity
    given:
      expression: "1996-12-19T16:39:57-08:00"
    expect:
      valid: true
  - id: conf-test:rfc-3339-invalid-001
    description: >-
      Basic format date-time is invalid in RFC 3339
    requirements:
      - req:rfc-3339-extended-format-only
    test_type: validity
    given:
      expression: "19850412T232050Z"
    expect:
      valid: false
  - id: conf-test:rfc-3339-valid-004
    description: "Valid date-time with lowercase t designator"
    requirements:
      - req:rfc-3339-time-designator
    test_type: validity
    given:
      expression: "1985-04-12t23:20:50Z"
    expect:
      valid: true
  - id: conf-test:rfc-3339-valid-005
    description: "Valid date-time with lowercase z UTC designator"
    requirements:
      - req:rfc-3339-lowercase-z
    test_type: validity
    given:
      expression: "1985-04-12T23:20:50z"
    expect:
      valid: true
  - id: conf-test:rfc-3339-invalid-002
    description: >-
      Time without seconds is invalid in RFC 3339
    requirements:
      - req:rfc-3339-seconds-required
    test_type: validity
    given:
      expression: "1985-04-12T23:20Z"
    expect:
      valid: false
  - id: conf-test:rfc-3339-invalid-003
    description: >-
      Hour value 24 is invalid in RFC 3339
    requirements:
      - req:rfc-3339-no-hour-24
    test_type: validity
    given:
      expression: "1985-04-12T24:00:00Z"
    expect:
      valid: false
  - id: conf-test:rfc-3339-invalid-004
    description: >-
      Date-only representation (no time component) is invalid in
      RFC 3339
    requirements:
      - req:rfc-3339-time-designator
      - req:rfc-3339-utc-offset-required
    test_type: validity
    given:
      expression: "1985-04-12"
    expect:
      valid: false
  - id: conf-test:rfc-3339-invalid-005
    description: >-
      Reduced precision date (year-month only) is invalid in RFC 3339
    requirements:
      - req:rfc-3339-full-date-required
    test_type: validity
    given:
      expression: "1985-04"
    expect:
      valid: false
  - id: conf-test:rfc-3339-invalid-006
    description: >-
      Space separator instead of T designator is invalid in RFC 3339
    requirements:
      - req:rfc-3339-time-designator
    test_type: validity
    given:
      expression: "1985-04-12 23:20:50Z"
    expect:
      valid: false
  - id: conf-test:rfc-3339-valid-006
    description: "Valid leap second representation"
    requirements:
      - req:rfc-3339-leap-second
    test_type: validity
    given:
      expression: "1990-12-31T23:59:60Z"
    expect:
      valid: true
  - id: conf-test:rfc-3339-valid-007
    description: "Valid leap second with UTC offset"
    requirements:
      - req:rfc-3339-leap-second
      - req:rfc-3339-offset-minutes-required
    test_type: validity
    given:
      expression: "1990-12-31T15:59:60-08:00"
    expect:
      valid: true
  - id: conf-test:rfc-3339-valid-008
    description: "Valid unknown local offset (-00:00)"
    requirements:
      - req:rfc-3339-unknown-local-offset
    test_type: validity
    given:
      expression: "1990-12-31T23:59:59-00:00"
    expect:
      valid: true
  - id: conf-test:rfc-3339-invalid-007
    description: >-
      Date-time without UTC offset is invalid in RFC 3339
    requirements:
      - req:rfc-3339-utc-offset-required
    test_type: validity
    given:
      expression: "1985-04-12T23:20:50"
    expect:
      valid: false
